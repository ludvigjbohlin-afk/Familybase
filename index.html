/* ===== Tema: Färgglad ===== */
body { font-family: var(--body); font-size: 17px; line-height: 1.55; }

.check { border-radius: 9px; border: 2.5px solid var(--ink); background: var(--field); color: var(--navy); font-weight: 800; }

/* Idag: stor rubrik direkt på bakgrunden, färgrutor per person, listan i en ram */

.tile { border: 2px solid transparent; border-radius: 20px; padding: 12px 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; font: inherit; color: var(--navy); cursor: pointer; }

.tile.dinner { background: var(--navy); color: #fff4ea; cursor: default; }
:root[data-theme="dark"] .tile.dinner { background: var(--surface); border-color: var(--edge); }

.tile.dinner .n { font-size: 1.35rem; font-stretch: 85%; line-height: 1.1; word-break: break-word; }
.dinner-line { display: none; color: var(--muted); margin: -6px 0 14px; font-weight: 700; }
.role-child .dinner-line { display: block; }
#sec-today .bar-head { color: var(--muted); font-weight: 700; }
#today-list { background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; padding: 2px 16px; }
#sec-today .task-title { color: var(--ink); }
.cat-ico { display: none; }
.role-child .cat-ico { display: inline; }
.bday-line { background: var(--m5); color: var(--navy); border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; font-weight: 700; }
.swap-banner { background: var(--sun); color: var(--navy); border: 2px solid var(--navy); border-radius: 18px; }

#board-list { display: grid; gap: 10px; }
#board-list li { border: 0; border-radius: 18px; padding: 12px 14px; background: var(--tint); color: var(--navy); }
#board-list li .meta { color: var(--navy); opacity: .75; }
#board-list li.empty { background: none; padding: 6px 0; color: var(--muted); }
#board-list li .ghost { border-color: var(--navy); color: var(--navy); }

/* Inloggning */
#login { background: var(--bg); }
.login-stack { width: 100%; max-width: 400px; }
.login-brand { margin: 0 0 18px; color: var(--ink); }
.login-brand span { display: block; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(2.8rem, 13vw, 3.6rem); line-height: .95; letter-spacing: -.03em; }
.login-brand small { display: block; margin-top: 10px; font-size: 1rem; color: var(--muted); max-width: 30ch; }
.login-card { max-width: none; }
.login-card h2, .setup h2 { font-size: 1.8rem; font-weight: 800; font-stretch: 80%; letter-spacing: -.02em; }

/* Sysslelistan: knapparna staplas i egen kolumn så titeln får plats */
#tasks li { display: grid; grid-template-columns: auto 1fr auto; column-gap: 12px; row-gap: 6px; align-items: start; }
#tasks li > .check { grid-row: 1 / span 2; margin-top: 2px; }
#tasks li > .task-main { grid-row: 1 / span 2; }
#tasks li > [data-edit] { grid-column: 3; grid-row: 1; }
#tasks li > [data-delete] { grid-column: 3; grid-row: 2; }
#tasks li.empty { display: block; }
#tasks li > [data-delete] { border-color: transparent; color: var(--muted); }

/* Menyn: svävande marinblå list med korallfärgad aktiv flik */
.wrap { padding-bottom: 130px; }
.tabbar { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--navy); border: 0; border-radius: 24px; padding: 7px; }
:root[data-theme="dark"] .tabbar { background: #0c1022; box-shadow: 0 0 0 2px var(--edge); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar { background: #0c1022; box-shadow: 0 0 0 2px var(--edge); } }
.tabbar-in { gap: 2px; }
.tabbar button { color: #c5cbe6; border-radius: 17px; padding: 7px 2px 6px; font-weight: 700; }
.tabbar button[aria-current="page"] { background: var(--coral); color: var(--navy); font-weight: 800; }
.tabbar button span { font-size: .72rem; }
.tabbar svg { width: 22px; height: 22px; stroke-width: 2.1; }
.toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
input, select, textarea { font-size: max(16px, 1rem) !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

let saveTimer = null, saving = false, again = false, hh = null, baseState = null, pollTimer = null;
const clone = o => JSON.parse(JSON.stringify(o));
const deepEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let draft = lsGet("hb-draft") || "";
function isChild() { return !LOCAL_MODE && !!hh && hh.role === "child"; }
function isOwner() { return LOCAL_MODE || (!!hh && hh.role === "owner"); }
function setSyncStatus(key) {
  document.getElementById("sync-status").textContent = key ? T[lang][key] : "";
}
function queueSave() {
  setSyncStatus(navigator.onLine === false ? "syncOffline" : "syncSaving");
  writeCache();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, 600);
}
async function doSave() {
  if (!currentUser || !state) return;
  if (saving) { again = true; return; }
  saving = true;
  try {
    if (LOCAL_MODE) {
      const { error } = await sb.from("household_data").upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() });
      setSyncStatus(error ? "syncError" : "syncSaved");
    } else {
      for (let attempt = 0; attempt < 5 && state; attempt++) {
        if (deepEq(state, baseState)) { setSyncStatus("syncSaved"); break; }
        const payload = clone(state);
        const { data, error } = await sb.rpc("save_household", { p_id: hh.id, p_data: payload, p_expected: hh.version });
        if (error) { setSyncStatus(isNetErr(error) ? "syncOffline" : "syncError"); break; }
        if (data.ok) {
          hh.version = data.version;
          if (data.data) {
            // the server removed something this account may not change: show what was really saved
            const cleaned = normalizeState(data.data);
            state = mergeStates(payload, state, cleaned);
            baseState = clone(cleaned);
            renderAll();
          } else baseState = payload;
          setSyncStatus("syncSaved");
          break;
        }
        // someone else saved first: combine their changes with ours and try again
        const remote = normalizeState(data.data);
        state = mergeStates(baseState, state, remote);
        baseState = clone(remote);
        hh.version = data.version;
        autoReset();
        renderAll();
      }
    }
  } catch (e) {
    setSyncStatus(isNetErr(e) ? "syncOffline" : "syncError");
  } finally {
    saving = false;
    writeCache();
    if (again) { again = false; doSave(); }
  }
}
function save() { queueSave(); }
function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; doSave(); }
}
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  while (saving) await new Promise(r => setTimeout(r, 50));
  await doSave();
}
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

function settings() { return { ...SETTINGS_DEFAULT, ...((state && state.settings) || {}) }; }
function normalizeState(d) {
  d = d && typeof d === "object" && !Array.isArray(d) ? d : {};
  return {
    ...d,
    members: Array.isArray(d.members) ? d.members : [],
    tasks: Array.isArray(d.tasks) ? d.tasks : [],
    checkins: Array.isArray(d.checkins) ? d.checkins : [],
    leave: d.leave && typeof d.leave === "object" ? d.leave : {},
    shopping: Array.isArray(d.shopping) ? d.shopping : [],
    swaps: Array.isArray(d.swaps) ? d.swaps : [],
    starLog: Array.isArray(d.starLog) ? d.starLog : [],
    doneLog: Array.isArray(d.doneLog) ? d.doneLog : [],
    rewards: Array.isArray(d.rewards) ? d.rewards : [],
    redeems: Array.isArray(d.redeems) ? d.redeems : [],
    starResets: Array.isArray(d.starResets) ? d.starResets : [],
    comments: Array.isArray(d.comments) ? d.comments : [],
    timeLog: Array.isArray(d.timeLog) ? d.timeLog : [],
    rewardsGiven: Array.isArray(d.rewardsGiven) ? d.rewardsGiven : [],
    board: Array.isArray(d.board) ? d.board : [],
    meals: d.meals && typeof d.meals === "object" && !Array.isArray(d.meals) ? d.meals : {},
    mealPrefs: typeof d.mealPrefs === "string" ? d.mealPrefs : "",
    welcomeDismissed: !!d.welcomeDismissed,
    settings: { ...SETTINGS_DEFAULT, ...(d.settings && typeof d.settings === "object" ? d.settings : {}) }
  };
}
function mergeById(base, local, remote) {
  const b = new Map((base || []).map(x => [x.id, x]));
  const l = new Map((local || []).map(x => [x.id, x]));
  const r = new Map((remote || []).map(x => [x.id, x]));
  const order = [...(remote || []).map(x => x.id), ...(local || []).map(x => x.id).filter(id => !r.has(id))];
  const out = [];
  for (const id of order) {
    const bi = b.get(id), li = l.get(id), ri = r.get(id);
    if (li && ri) out.push(deepEq(li, bi) ? ri : li);
    else if (li && !ri) { if (!bi || !deepEq(li, bi)) out.push(li); }
    else if (!li && ri) { if (!bi || !deepEq(ri, bi)) out.push(ri); }
  }
  return out;
}
function mergeStates(base, local, remote) {
  const bs = base || {};
  const out = { ...remote };
  out.members = mergeById(bs.members, local.members, remote.members);
  out.tasks = mergeById(bs.tasks, local.tasks, remote.tasks);
  out.checkins = mergeById(bs.checkins, local.checkins, remote.checkins);
  out.shopping = mergeById(bs.shopping, local.shopping, remote.shopping);
  out.swaps = mergeById(bs.swaps, local.swaps, remote.swaps);
  out.starLog = mergeById(bs.starLog, local.starLog, remote.starLog);
  out.doneLog = mergeById(bs.doneLog, local.doneLog, remote.doneLog);
  out.rewards = mergeById(bs.rewards, local.rewards, remote.rewards);
  out.redeems = mergeById(bs.redeems, local.redeems, remote.redeems);
  out.starResets = mergeById(bs.starResets, local.starResets, remote.starResets);
  out.comments = mergeById(bs.comments, local.comments, remote.comments);
  out.timeLog = mergeById(bs.timeLog, local.timeLog, remote.timeLog);
  out.rewardsGiven = mergeById(bs.rewardsGiven, local.rewardsGiven, remote.rewardsGiven);
  out.board = mergeById(bs.board, local.board, remote.board);
  out.meals = { ...(remote.meals || {}) };
  Object.keys(local.meals || {}).forEach(d => {
    if (JSON.stringify((local.meals || {})[d]) !== JSON.stringify((bs.meals || {})[d])) out.meals[d] = local.meals[d];
  });
  Object.keys(bs.meals || {}).forEach(d => { if (!(d in (local.meals || {})) && JSON.stringify((remote.meals || {})[d]) === JSON.stringify(bs.meals[d])) delete out.meals[d]; });
  if (local.guide === false || remote.guide === false) out.guide = false;
  out.leave = { ...(remote.leave || {}) };
  Object.keys(local.leave || {}).forEach(id => {
    if ((local.leave[id] || 0) !== ((bs.leave || {})[id] || 0)) out.leave[id] = local.leave[id];
  });
  Object.keys(out.leave).forEach(id => { if (!out.members.some(m => m.id === id)) delete out.leave[id]; });
  out.welcomeDismissed = !!(local.welcomeDismissed || remote.welcomeDismissed);
  out.settings = { ...SETTINGS_DEFAULT, ...(remote.settings || {}) };
  Object.keys(SETTINGS_DEFAULT).forEach(key => {
    const lv = (local.settings || {})[key], bv = (bs.settings || {})[key];
    if (lv !== undefined && JSON.stringify(lv) !== JSON.stringify(bv)) out.settings[key] = lv;
  });
  return out;
}
async function loadCloud() {
  const { data, error } = await sb.rpc("my_household");
  if (error) throw error;
  if (!data) return false;
  hh = {
    id: data.household.id, name: data.household.name, version: data.household.version,
    role: data.role, memberId: data.member_id, members: data.members || [], invites: data.invites || null
  };
  state = normalizeState(data.household.data);
  baseState = clone(state);
  return true;
}
async function ensureOwnMember() {
  const mine = hh.members.find(a => a.user_id === currentUser.id);
  const name = (mine && mine.display_name) || "Förälder";
  const linked = new Set(hh.members.map(a => a.member_id).filter(Boolean));
  let m = state.members.find(x => !linked.has(x.id) && String(x.name).trim().toLowerCase() === name.trim().toLowerCase());
  if (!m) { m = { id: uid(), name, color: nextColor() }; state.members.push(m); }
  hh.memberId = m.id;
  const { error } = await sb.rpc("link_member", { p_member_id: m.id });
  if (error) throw error;
  save();
}
async function openHousehold() {
  const cached = readCache();
  let loaded;
  try { loaded = await loadCloud(); }
  catch (ex) {
    if (isNetErr(ex) && cached && cached.hh && cached.state) {
      hh = cached.hh; state = normalizeState(cached.state); baseState = normalizeState(cached.base || cached.state);
      setSyncStatus("syncOffline");
      return true;
    }
    throw ex;
  }
  if (!loaded) return false;
  if (cached && cached.hh && cached.hh.id === hh.id && cached.state && cached.base && !deepEq(cached.state, cached.base)) {
    // changes made while offline: combine them with what is on the server now
    state = mergeStates(normalizeState(cached.base), normalizeState(cached.state), state);
    queueSave();
  }
  if (!hh.memberId || !memberById(hh.memberId)) await ensureOwnMember();
  if (!lsGet("hb-lang") && (settings().lang === "sv" || settings().lang === "en")) lang = settings().lang;
  return true;
}

function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } stopRealtime(); }
async function refreshHousehold(force) {
  if (LOCAL_MODE || !currentUser || !hh) return;
  if (force) { while (saving) await new Promise(r => setTimeout(r, 50)); } else if (saving) return;
  const { data, error } = await sb.rpc("my_household");
  if (error) return;
  if (!data) {
    stopPolling(); hh = null; state = null; baseState = null;
    applyRole(); showSetup();
    return;
  }
  const sig = () => JSON.stringify([hh.role, hh.members, hh.name, hh.invites]);
  const before = sig();
  hh.role = data.role; hh.members = data.members || []; hh.name = data.household.name; hh.invites = data.invites || null;
  let changed = before !== sig();
  if (data.household.version !== hh.version) {
    const remote = normalizeState(data.household.data);
    state = mergeStates(baseState, state, remote);
    baseState = clone(remote);
    hh.version = data.household.version;
    autoReset();
    if (!deepEq(state, baseState)) queueSave();
    changed = true;
  }
  if (changed || force) { applyRole(); renderAll(); }
  writeCache();
}

/* ---------- Repeats, weekly load, auto-reset ---------- */
const WEEK_W = { once: 1, daily: 7, weekly: 1, monthly: 0.25 };
const FREQ_BY_SV = {
  "Diska": "daily", "Laga middag": "daily", "Packa matlådor": "daily", "Packa väskan till förskolan": "daily",
  "Hämta och lämna barn": "daily", "Mata husdjuret": "daily", "Gå ut med hunden": "daily", "Plocka i och ur diskmaskinen": "daily",
  "Tömma papperskorgar": "weekly", "Tvätta sopkärl": "monthly", "Tvätta bilen": "monthly", "Betala räkningar": "monthly",
  "Gå igenom kontoutdrag": "monthly", "Se över försäkringar": "once", "Deklarera": "once", "Boka tandläkartid": "once",
  "Boka tandläkartid till barnen": "once", "Boka hantverkare": "once", "Skicka födelsedagskort": "once", "Byta glödlampa": "once",
  "Fylla i blanketter för förskola och skola": "once", "Hämta ut recept på apoteket": "once"
};
function freqFor(item) { return FREQ_BY_SV[item.sv] || "weekly"; }
function weeklyMins(k) { return Number(k.minutes || 0) * (WEEK_W[k.freq || "weekly"] || 1); }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(), week: Math.ceil(((t - y) / 86400000 + 1) / 7) };
}
function periodKey(freq, d) {
  if (freq === "daily") return d.toDateString();
  if (freq === "weekly") {
    const ws = Number(settings().weekStart) === 0 ? 0 : 1;
    const st = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    st.setDate(st.getDate() - ((st.getDay() - ws + 7) % 7));
    return "w" + st.toDateString();
  }
  if (freq === "monthly") return d.getFullYear() + "-" + d.getMonth();
  return "once";
}
function autoReset() {
  if (!state) return;
  const now = new Date();
  let changed = false;
  state.tasks.forEach(k => {
    if (k.done && k.doneAt && k.freq && k.freq !== "once") {
      if (periodKey(k.freq, new Date(k.doneAt)) !== periodKey(k.freq, now)) { k.done = false; k.doneAt = null; (k.steps || []).forEach(x => { x.done = false; }); changed = true; }
    }
  });
  if (applyRotation()) changed = true;
  if (changed) save();
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state) { autoReset(); renderAll(); refreshHousehold(); mineFetch(); }
});

function computeScore() {
  const n = state.members.length;
  const totals = state.members.map(m => state.tasks.filter(k => k.owner === m.id).reduce((s, k) => s + weeklyMins(k), 0));
  const total = totals.reduce((a, b) => a + b, 0);
  if (n < 2 || !total) return null;
  const e = 100 / n;
  const maxShare = Math.max(...totals) / total * 100;
  return Math.max(0, Math.round(100 * (1 - (maxShare - e) / (100 - e))));
}

function renderLoad() {
  const t = T[lang];
  const totals = state.members.map(m => ({
    m, mins: state.tasks.filter(k => k.owner === m.id).reduce((s, k) => s + weeklyMins(k), 0)
  }));
  const total = totals.reduce((s, x) => s + x.mins, 0);
  const loadEl = document.getElementById("load");
  const note = document.getElementById("load-note");
  const fair = document.getElementById("fair");
  if (!total) {
    loadEl.innerHTML = ""; note.textContent = t.noLoad; fair.innerHTML = ""; return;
  }
  loadEl.innerHTML = totals.map(({ m, mins }) => {
    const pct = Math.round((mins / total) * 100);
    return `<div class="bar-wrap">
      <div class="bar-head"><span>${esc(m.name)}</span><span>${pct}% (${Math.round(mins)} ${t.minWeek})</span></div>
      <div class="bar"><span style="width:${pct}%;background:${COLORS[m.color % COLORS.length]}"></span></div>
    </div>`;
  }).join("");
  const top = totals.reduce((a, b) => (b.mins > a.mins ? b : a));
  const topPct = Math.round((top.mins / total) * 100);
  const inRange = totals.length < 2 || totals.every(x => {
    const p = (x.mins / total) * 100; return p >= 40 && p <= 60;
  });
  note.textContent = totals.length >= 2 && topPct > 60
    ? t.lean.replace("{name}", top.m.name).replace("{pct}", topPct)
    : t.balanced;
  fair.innerHTML = `<span class="badge-fair" style="background:${inRange ? "rgba(95,143,107,.18)" : "rgba(224,165,38,.2)"};color:var(--ink)">${inRange ? t.fairOk : t.fairOff}</span>`;
  const sg = computeSuggestion();
  if (sg) {
    const text = t.suggest.replace("{task}", esc(taskName(sg.k))).replace("{from}", esc(sg.from.name)).replace("{to}", esc(sg.to.name));
    fair.innerHTML += `<div class="suggest"><span>${text}</span><button class="ghost" data-move-task="${sg.k.id}" data-move-to="${sg.to.id}">${t.move}</button></div>`;
  }
}

function computeSuggestion() {
  if (state.members.length < 2) return null;
  const totals = state.members.map(m => ({ m, mins: state.tasks.filter(k => k.owner === m.id).reduce((a, k) => a + weeklyMins(k), 0) }));
  const total = totals.reduce((a, x) => a + x.mins, 0);
  if (!total) return null;
  const hi = totals.reduce((a, b) => (b.mins > a.mins ? b : a));
  const adultsLeft = totals.filter(x => x.m.id !== hi.m.id && !isKid(x.m));
  const pool = adultsLeft.length ? adultsLeft : totals;
  const lo = pool.reduce((a, b) => (b.mins < a.mins ? b : a));
  if (hi.m.id === lo.m.id || hi.mins / total <= 0.6) return null;
  const diff = hi.mins - lo.mins;
  let best = null;
  state.tasks.filter(k => k.owner === hi.m.id && !(k.done && (k.freq || "weekly") === "once")).forEach(k => {
    const w = weeklyMins(k);
    if (w <= 0 || w >= diff) return;
    const after = Math.abs((hi.mins - w) - (lo.mins + w));
    if (!best || after < best.after) best = { k, after };
  });
  return best ? { k: best.k, from: hi.m, to: lo.m } : null;
}

document.getElementById("hh-body").addEventListener("click", async e => {

  if (act === "copy") {
    if (await copyText(b.dataset.code)) { b.textContent = T[lang].copied; setTimeout(renderHousehold, 1500); }
    return;
  }
  if (act === "copylink") {

    return;

  if (act === "share") {

    return;
  }
  const key = act + ":" + user;
  if (["remove", "owner", "leave", "delete", "codes"].includes(act) && hhConfirm !== key) {
    hhConfirm = key;
    renderHousehold();
    setTimeout(() => { if (hhConfirm === key) { hhConfirm = null; if (hh) renderHousehold(); } }, 4000);
    return;
  }
  hhConfirm = null;
  const msg = document.getElementById("hh-msg");
  msg.textContent = "";
  let res = null;
  try {
    if (act === "role") res = await sb.rpc("set_member_role", { p_id: hh.id, p_user: user, p_role: b.dataset.role });
    else if (act === "remove") res = await sb.rpc("remove_member", { p_id: hh.id, p_user: user });
    else if (act === "owner") res = await sb.rpc("transfer_ownership", { p_id: hh.id, p_user: user });
    else if (act === "codes") res = await sb.rpc("regenerate_invites", { p_id: hh.id });

    else if (act === "delete") res = await sb.rpc("delete_household", { p_id: hh.id });
  } catch (ex) { res = { error: ex }; }
  if (res && res.error) { msg.textContent = rpcErrorText(res.error); renderHousehold(); return; }
  await refreshHousehold(true);
});

document.getElementById("task-form").onsubmit = e => {
  e.preventDefault();
  if (isChild()) return;
  const title = document.getElementById("k-title").value.trim();
  const owner = document.getElementById("k-owner").value;
  if (!title || !owner) return;
  const data = {
    title, owner,
    cat: Number(document.getElementById("k-cat").value),
    minutes: Math.max(1, Number(document.getElementById("k-min").value) || 15),
    stars: Math.max(0, Math.min(10, Math.round(Number(document.getElementById("k-stars").value)))) || 0,
    freq: document.getElementById("k-freq").value
  };
  const kd = document.getElementById("k-date").value, kt = document.getElementById("k-time").value, kw = document.getElementById("k-wday").value;
  data.time = kt || "";
  data.date = (data.freq === "once" || data.freq === "monthly") ? (kd || "") : "";
  data.wday = data.freq === "weekly" && kw !== "" ? Number(kw) : null;
  data.note = document.getElementById("k-note").value.trim().slice(0, 200);
  const prevSteps = (editId && (state.tasks.find(x => x.id === editId) || {}).steps) || [];
  data.steps = document.getElementById("k-steps").value.split("\n").map(x => x.trim().slice(0, 60)).filter(Boolean).slice(0, 12)
    .map(text => { const old = prevSteps.find(x => x.text === text); return old ? old : { id: uid(), text, done: false }; });
  const rotIds = [...document.querySelectorAll("#k-rot [aria-pressed=true]")].map(b => b.dataset.rot).filter(id => memberById(id));
  const prevTask = editId ? state.tasks.find(x => x.id === editId) : null;
  if (rotIds.length >= 2 && data.freq !== "once") {
    if (!rotIds.includes(data.owner)) data.owner = rotIds[0];
    const same = prevTask && prevTask.rot && JSON.stringify(prevTask.rot.ids) === JSON.stringify(rotIds) && prevTask.owner === data.owner;
    data.rot = same ? prevTask.rot : { ids: rotIds, first: data.owner, start: isoDay(weekStartOf(new Date())) };
  } else data.rot = null;
  if (editId) {
    const k = state.tasks.find(x => x.id === editId);
    if (k) { if (data.title !== taskName(k)) k.ref = null; Object.assign(k, data); }
  } else {
    state.tasks.push({ id: uid(), ...data, done: false });
  }
  setEditMode(null);
  closeAdd();
  save(); renderAll();
};

const onTaskClick = e => {
  const tog = e.target.closest("[data-toggle]");
  const del = e.target.closest("[data-delete]");
  const edit = e.target.closest("[data-edit]");
  if (isChild() && (edit || del)) return;
  if (edit) { setEditMode(edit.dataset.edit); return; }
  if (tog) {
    const k = state.tasks.find(x => x.id === tog.dataset.toggle);
    if (k && (!isChild() || (settings().childCheck && k.owner === hh.memberId))) {
      toggleDone(k);
      timeAsk = k.done && timeEntries(k).length < 5 ? k.id : null;
      if (k.done) {
        justDone = k.id;
        const pid = todayPerson();
        if (e.currentTarget && e.currentTarget.id === "today-list" && pid && state.tasks.filter(x => x.owner === pid && dueStatus(x) !== "later").every(x => x.done)) confetti();
      }
    }
  } else if (del) {
    if (editId === del.dataset.delete) setEditMode(null);
    const idx = state.tasks.findIndex(x => x.id === del.dataset.delete);
    const gone = state.tasks[idx];
    state.tasks = state.tasks.filter(x => x.id !== del.dataset.delete);
    if (gone) showUndo(taskName(gone), () => { state.tasks.splice(Math.min(idx, state.tasks.length), 0, gone); });
  } else return;
  save(); renderAll();
};

function buildSummary() {
  const t = T[lang];
  const totals = state.members.map(m => ({ m, mins: state.tasks.filter(k => k.owner === m.id).reduce((s, k) => s + weeklyMins(k), 0) }));
  const total = totals.reduce((s, x) => s + x.mins, 0);
  const lines = [t.summaryHead.replace("{week}", isoWeek(new Date()).week)];
  totals.forEach(({ m, mins }) => lines.push(`${m.name}: ${total ? Math.round(mins / total * 100) : 0}% (${Math.round(mins)} ${t.minWeek})`));
  const sc = computeScore();
  if (sc !== null) lines.push(t.summaryScore.replace("{score}", sc));
  lines.push(t.summaryDone.replace("{done}", state.tasks.filter(k => k.done).length).replace("{total}", state.tasks.length));
  return lines.join("\n");
}
document.getElementById("copy-summary").onclick = async () => {
  if (isChild()) return;
  const t = T[lang];
  const btn = document.getElementById("copy-summary");
  const out = document.getElementById("summary-out");
  const text = buildSummary();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) {
    out.hidden = false; out.value = text; out.focus(); out.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
  }
  if (ok) {
    out.hidden = true;
    btn.textContent = t.copied;
    setTimeout(() => { btn.textContent = T[lang].copySummary; }, 2000);
  } else {
    btn.textContent = t.copyManual;
  }
};

const locNow = () => lang === "sv" ? "sv-SE" : "en-GB";
function canEditMember(m) { return !!m && (!isChild() || (hh && m.id === hh.memberId && settings().childProfile)); }
function wdOrder() { return settings().weekStart === 0 ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 0]; }
function dayShort(d) { return new Date(2026, 0, 4 + d).toLocaleDateString(locNow(), { weekday: "short" }).replace(".", ""); }
function actsOf(m) { return (m && Array.isArray(m.hobbies) ? m.hobbies : []).filter(a => a && typeof a === "object" && a.title && Array.isArray(a.days) && a.days.length); }
function actTime(a) { return a.time ? a.time + (a.end ? "–" + a.end : "") : ""; }
function actDaysText(a) { return wdOrder().filter(d => a.days.includes(d)).map(dayShort).join(", "); }
function renderBday(el, m) {
  if (!el || !m || el.contains(document.activeElement)) return;
  const t = T[lang], ed = canEditMember(m) ? "" : " disabled";
  let [y, mo, d] = (m.birthday || "").split("-");
  const dr = el._draft && el._draft.mid === m.id ? el._draft : null;
  if (dr) { d = dr.d ? String(dr.d) : ""; mo = dr.m ? String(dr.m) : ""; y = dr.y ? String(dr.y) : ""; }
  const yNow = new Date().getFullYear();
  const opt = (v, txt, cur) => `<option value="${v}"${String(cur) === String(v) ? " selected" : ""}>${esc(txt)}</option>`;
  el.dataset.mid = m.id;
  el.innerHTML = `<select data-bd="d" aria-label="${esc(t.bdDay)}"${ed}>${opt("", t.bdDay, d ? Number(d) : "")}${[...Array(31)].map((_, i) => opt(i + 1, i + 1, d ? Number(d) : "")).join("")}</select>`
    + `<select data-bd="m" aria-label="${esc(t.bdMonth)}"${ed}>${opt("", t.bdMonth, mo ? Number(mo) : "")}${[...Array(12)].map((_, i) => opt(i + 1, new Date(2026, i, 1).toLocaleDateString(locNow(), { month: "long" }), mo ? Number(mo) : "")).join("")}</select>`
    + `<select data-bd="y" aria-label="${esc(t.bdYear)}"${ed}>${opt("", t.bdYear, y && y !== "0000" ? Number(y) : "")}${[...Array(yNow - 1919)].map((_, i) => opt(yNow - i, yNow - i, y && y !== "0000" ? Number(y) : "")).join("")}</select>`;
}
function onBdayChange(e) {
  const el = e.currentTarget, m = memberById(el.dataset.mid);
  if (!m || !canEditMember(m)) return;
  const v = k => el.querySelector(`[data-bd="${k}"]`).value;
  let d = Number(v("d")), mo = Number(v("m")), y = Number(v("y"));
  el._draft = null;
  if (!d && !mo && !y) { m.birthday = ""; save(); renderAll(); return; }
  if (!d || !mo) { el._draft = { mid: m.id, d, m: mo, y }; return; }
  const maxD = new Date(y || 2000, mo, 0).getDate();
  if (d > maxD) { d = maxD; el.querySelector('[data-bd="d"]').value = String(d); }
  m.birthday = (y ? String(y) : "0000") + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  save(); renderAll();
}
["p-bday", "a-bday"].forEach(id => document.getElementById(id).addEventListener("change", onBdayChange));

function onActsClick(e) {
  const el = e.currentTarget, m = memberById(el.dataset.mid), t = T[lang];
  if (!m || !canEditMember(m)) return;
  const day = e.target.closest("[data-act-day]");
  if (day) { day.setAttribute("aria-pressed", String(day.getAttribute("aria-pressed") !== "true")); return; }
  const del = e.target.closest("[data-act-del]");
  if (del) {
    const gone = actsOf(m).find(a => a.id === del.dataset.actDel);
    m.hobbies = actsOf(m).filter(a => a.id !== del.dataset.actDel);
    if (gone) showUndo(gone.title, () => { m.hobbies = actsOf(m).concat([gone]); }, t.actRemoved.replace("{x}", gone.title));
    save(); renderAll(); return;
  }
  if (e.target.closest("[data-act-add]")) {
    const title = el.querySelector(".act-title").value.trim().slice(0, 40);
    const days = [...el.querySelectorAll('[data-act-day][aria-pressed="true"]')].map(b => Number(b.dataset.actDay)).sort((x, y) => x - y);
    if (!title || !days.length) { el.querySelector(".act-err").textContent = t.actErr; return; }
    const time = el.querySelector(".act-from").value || "", end = el.querySelector(".act-to").value || "";
    m.hobbies = actsOf(m).concat([{ id: uid(), title, days, time, end: time && end > time ? end : "" }]);
    if (document.activeElement) document.activeElement.blur();
    save(); renderAll();
    renderActs(el, m, true);
  }
}

function addShopItem(text) {
  text = String(text || "").trim().slice(0, 60);
  let qty = 1, amount = "";
  const mq = text.match(/^(\d+(?:[.,]\d+)?(?:\s*-\s*\d+)?)\s*(st|x|×|pcs|g|gram|kg|hg|ml|cl|dl|l|liter|msk|tsk|krm|paket|pkt|förp|burk|burkar|påse|påsar|flaska|flaskor|knippe|klyfta|klyftor|skivor|tbsp|tsp|cups?|cans?|packs?|bags?|bottles?|cloves?|slices?)?\.?\s+(.+)$/i);
  if (mq) {
    const unit = (mq[2] || "").toLowerCase();
    if (!unit || /^(st|x|×|pcs)$/.test(unit)) qty = Math.max(1, parseInt(mq[1], 10) || 1);
    else amount = (mq[1] + " " + mq[2]).slice(0, 20);
    text = mq[3].trim();
  }
  if (!text) return;
  text = text.charAt(0).toUpperCase() + text.slice(1);
  state.shopping = state.shopping || [];
  const dup = state.shopping.find(x => !x.done && x.text.toLowerCase() === text.toLowerCase());
  if (dup) {
    if (amount) dup.amount = dup.amount ? (dup.amount + " + " + amount).slice(0, 40) : amount;
    else dup.qty = (dup.qty || 1) + (mq ? qty : 1);
  } else {
    const was = state.shopping.find(x => x.done && x.text.toLowerCase() === text.toLowerCase());
    if (was) { was.done = false; was.qty = qty; was.amount = amount; }
    else state.shopping.push(amount ? { id: uid(), text, qty, amount, done: false } : { id: uid(), text, qty, done: false });
  }
  save(); renderShopping();
}

/* ---------- Dates on chores ---------- */
function isoDay(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekStartOf(d) {
  const ws = Number(settings().weekStart) === 0 ? 0 : 1;
  const st = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  st.setDate(st.getDate() - ((st.getDay() - ws + 7) % 7));
  return st;
}
// The date this chore falls on in the current period, or null when it has no fixed day.
function occurrence(k, now) {
  now = now || new Date();
  const f = k.freq || "weekly";
  if (f === "daily") return isoDay(now);
  if (f === "weekly") {
    if (k.wday === null || k.wday === undefined || k.wday === "") return null;
    const st = weekStartOf(now);
    const off = (Number(k.wday) - st.getDay() + 7) % 7;
    const d = new Date(st); d.setDate(st.getDate() + off);
    return isoDay(d);
  }
  if (!k.date) return null;
  if (f === "monthly") {
    const day = Number(k.date.slice(8, 10));
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return isoDay(new Date(now.getFullYear(), now.getMonth(), Math.min(day, last)));
  }
  return k.date;
}
// "open" (no fixed day), "today", "late", "later" (upcoming this period)
function dueStatus(k) {
  const o = occurrence(k);
  if (!o) return "open";
  const today = isoDay(new Date());
  if (o === today) return "today";
  if (o < today) return k.done ? "today" : "late";
  return "later";
}
function whenText(k) {
  const t = T[lang], f = k.freq || "weekly", parts = [];
  if (f === "weekly" && k.wday !== null && k.wday !== undefined && k.wday !== "") parts.push(t.wdays[Number(k.wday)]);
  if (f === "once" && k.date) parts.push(fmtDate(k.date));
  if (f === "monthly" && k.date) parts.push(t.monthDay.replace("{d}", Number(k.date.slice(8, 10))));
  if (k.time) parts.push(t.atTime.replace("{t}", k.time));
  return parts.join(", ");
}
// Does chore k fall on day iso (for the calendar)? Daily chores are left out to keep the week readable.
function choreOnDay(k, iso) {
  const f = k.freq || "weekly", d = new Date(iso + "T00:00:00");
  if (f === "daily") return false;
  if (f === "weekly") return k.wday !== null && k.wday !== undefined && k.wday !== "" && Number(k.wday) === d.getDay();
  if (!k.date) return false;
  if (f === "monthly") { const day = Number(k.date.slice(8, 10)); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return d.getDate() === Math.min(day, last); }
  return k.date === iso;
}

/* ---------- Family week calendar ---------- */
let calOffset = 0;
function renderCalendar() {
  const t = T[lang], loc = lang === "sv" ? "sv-SE" : "en-GB";
  const start = weekStartOf(new Date());
  start.setDate(start.getDate() + calOffset * 7);
  const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  const today = isoDay(new Date());
  document.getElementById("cal-title").textContent = calOffset === 0 ? t.calTitle : t.weekN.replace("{n}", isoWeek(start).week);
  document.getElementById("cal-range").textContent = days[0].toLocaleDateString(loc, { day: "numeric", month: "short" }) + " – " + days[6].toLocaleDateString(loc, { day: "numeric", month: "short" }) + (calOffset === 0 ? "" : "");
  const curWeek = calOffset === 0;
  const canEditEv = m => !isChild() || (m.id === hh.memberId && settings().childProfile);
  document.getElementById("cal-days").innerHTML = days.map(d => {
    const iso = isoDay(d);
    const items = [];
    state.members.forEach(m => (m.events || []).forEach(ev => { if (ev.date === iso) items.push({ kind: "ev", m, time: ev.time || "", title: ev.title, id: ev.id, del: canEditEv(m) }); }));
    state.members.forEach(m => actsOf(m).forEach(a => { if (a.days.includes(d.getDay())) items.push({ kind: "act", m, time: a.time || "", title: a.title + (a.end ? " (–" + a.end + ")" : "") }); }));
    state.members.forEach(m => { if (m.birthday && m.birthday.slice(5) === iso.slice(5)) items.push({ kind: "bday", m, time: "", title: "🎂 " + bdayText(m, d) }); });
    state.tasks.forEach(k => { if (choreOnDay(k, iso)) items.push({ kind: "task", m: memberById(k.owner), time: k.time || "", title: taskName(k), done: curWeek && !!k.done }); });
    items.sort((x, y) => (x.time || "99").localeCompare(y.time || "99"));
    const head = d.toLocaleDateString(loc, { weekday: "long", day: "numeric", month: "short" });
    return `<div class="cal-day${iso === today ? " today" : ""}"><h3>${esc(head.charAt(0).toUpperCase() + head.slice(1))}${iso === today ? `<span class="tag">${esc(t.calToday)}</span>` : ""}</h3>${items.length ? items.map(it => `<div class="cal-item${it.done ? " done" : ""}">
        <span class="bar-dot" style="background:${it.m ? COLORS[it.m.color % COLORS.length] : "var(--line-strong)"}"></span>
        <span class="ci-time">${esc(it.time)}</span>
        <div class="ci-main"><div class="ci-title">${it.kind === "task" ? (it.done ? "✓ " : "") : ""}${esc(it.title)}</div><div class="ci-who">${it.m ? esc(it.m.name) : esc(t.unassigned)}${it.kind === "task" ? ", " + esc(t.tabChores.toLowerCase()) : ""}</div></div>
        ${it.kind === "ev" && it.del ? `<button class="ghost" data-del-ev="${it.id}" data-who="${it.m.id}" aria-label="${esc(t.remove)}">✕</button>` : ""}
      </div>`).join("") : `<div class="cal-empty">${esc(t.calEmpty)}</div>`}</div>`;
  }).join("");
  const who = document.getElementById("e-who");
  const prev = who.value;
  const list = isChild() ? state.members.filter(x => x.id === hh.memberId) : state.members;
  who.innerHTML = list.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  if (prev && list.some(x => x.id === prev)) who.value = prev;
  else if (!LOCAL_MODE && hh && list.some(x => x.id === hh.memberId)) who.value = hh.memberId;
  const dIn = document.getElementById("e-date");
  if (!dIn.value) dIn.value = today;
}

function confetti() {

  const colors = ["#ffd166", "#ff8a5c", "#7bdcb5", "#b9a6f2", "#8fc9f5", "#1b2340"];

/* ---------- My own things (private: separate table, only the owner can read it) ---------- */
let mine = [], mineShowAll = false, mineErr = "", mineSyncing = false;
function mineKey() { return "hb-mine-" + (currentUser ? currentUser.id : "local"); }
function mineStore() { lsSet(mineKey(), JSON.stringify(mine)); }
function mineLoadLocal() { try { mine = JSON.parse(lsGet(mineKey()) || "[]") || []; } catch (e) { mine = []; } }
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
}
async function mineFetch() {
  mineLoadLocal();
  if (LOCAL_MODE || !currentUser) { renderMine(); return; }
  try {
    const { data, error } = await sb.from("personal_items").select("id,title,due_date,due_time,done,done_at").order("due_date", { ascending: true });
    if (error) {
      mineErr = isNetErr(error) ? "" : (/personal_items|relation|schema cache|does not exist|not find/i.test(error.message || "") ? T[lang].mineNeedsSql : rpcErrorText(error));
      renderMine(); return;
    }
    mineErr = "";
    const local = new Map(mine.map(x => [x.id, x]));
    const server = (data || []).map(r => ({ id: r.id, title: r.title, date: r.due_date || "", time: String(r.due_time || "").slice(0, 5), done: !!r.done, doneAt: r.done_at || null }));
    const ids = new Set(server.map(x => x.id));
    mine = server.map(x => { const l = local.get(x.id); return l && (l._dirty || l._del) ? l : x; })
      .concat(mine.filter(x => !ids.has(x.id) && x._dirty && !x._del));
    // tidy away things that were done more than 30 days ago
    const old = Date.now() - 30 * 86400000;
    mine.forEach(x => { if (x.done && x.doneAt && new Date(x.doneAt).getTime() < old) x._del = true; });
    mineStore(); renderMine(); mineSync();
  } catch (e) { renderMine(); }
}
async function mineSync() {
  if (LOCAL_MODE || !currentUser || mineSyncing) return;
  const dirty = mine.filter(x => x._dirty && !x._del), dels = mine.filter(x => x._del);
  if (!dirty.length && !dels.length) return;
  mineSyncing = true;
  try {
    if (dirty.length) {
      const rows = dirty.map(x => ({ id: x.id, title: x.title, due_date: x.date || null, due_time: x.time || null, done: !!x.done, done_at: x.doneAt || null }));
      const { error } = await sb.from("personal_items").upsert(rows);
      if (!error) { dirty.forEach(x => { delete x._dirty; }); mineErr = ""; }
      else if (!isNetErr(error)) mineErr = /personal_items|relation|schema cache|does not exist|not find/i.test(error.message || "") ? T[lang].mineNeedsSql : rpcErrorText(error);
    }
    if (dels.length) {
      const { error } = await sb.from("personal_items").delete().in("id", dels.map(x => x.id));
      if (!error) { const gone = new Set(dels.map(x => x.id)); mine = mine.filter(x => !gone.has(x.id)); }
    }
  } catch (e) {}
  finally { mineSyncing = false; mineStore(); renderMine(); }
}
function mineChanged() { mineStore(); renderMine(); mineSync(); }
function mineRow(x, today, showDate) {
  const t = T[lang];
  const late = !x.done && x.date && x.date < today;
  return `<li><div class="check big" role="checkbox" tabindex="0" aria-checked="${!!x.done}" data-mine-toggle="${x.id}">${x.done ? "✓" : ""}</div>
    <div class="task-main"><div class="task-title ${x.done ? "done" : ""}">${esc(x.title)}</div><div class="meta">${late ? `<span class="pill late">${esc(t.late)}</span>` : ""}${(showDate || late) && x.date ? `<span class="pill">${esc(fmtDate(x.date))}</span>` : ""}${x.time ? `<span class="pill">${esc(t.atTime.replace("{t}", x.time))}</span>` : ""}</div></div>
    <button class="ghost" data-mine-del="${x.id}" aria-label="${esc(t.remove)}">✕</button></li>`;
}
function renderMine() {
  const t = T[lang], today = isoDay(new Date());
  document.getElementById("mine-err").textContent = mineErr;
  const vis = mine.filter(x => !x._del);
  const isNow = x => (!x.date || x.date <= today) && (!x.done || (x.doneAt && isoDay(new Date(x.doneAt)) === today));
  const rank = x => x.done ? 2 : (x.date && x.date < today ? 0 : 1);
  const now = vis.filter(isNow).sort((a, b) => rank(a) - rank(b) || String(a.time || "99").localeCompare(String(b.time || "99")));
  const later = vis.filter(x => x.date && x.date > today && !x.done).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  document.getElementById("mine-list").innerHTML = now.length ? now.map(x => mineRow(x, today, false)).join("") : `<li class="empty">${esc(t.mineEmpty)}</li>`;
  const more = document.getElementById("mine-more");
  more.hidden = !later.length;
  more.textContent = mineShowAll ? t.mineLess : t.mineMore.replace("{n}", later.length);
  const lw = document.getElementById("mine-later");
  lw.hidden = !mineShowAll || !later.length;
  lw.innerHTML = later.map(x => mineRow(x, today, true)).join("");
  const d = document.getElementById("mine-date");

}

const onMineClick = e => {

async function aiPlanWeek() {

      if (!code && (isNetErr(error) || /FunctionsFetchError|FunctionsRelayError/.test(error.name || ""))) code = "net";

/* ---------- Stars and rewards (milestones) ---------- */
function starsOf(k) { const n = Number(k && k.stars); return k && k.stars !== undefined && k.stars !== null && isFinite(n) ? Math.max(0, Math.min(10, Math.round(n))) : 1; }
function lastReset(id) { return (state.starResets || []).filter(x => x.m === id).reduce((a, x) => Math.max(a, Number(x.at) || 0), 0); }
function starsEarned(id) {
  const since = lastReset(id);
  return (state.starLog || []).filter(e => e.m === id && (Number(e.at) || 0) > since)
    .reduce((a, e) => a + (e.n === undefined || e.n === null ? 1 : Math.max(0, Math.min(10, Number(e.n) || 0))), 0);
}
function starBalance(id) { return starsEarned(id); }
function milestones() { return (state.rewards || []).slice().sort((a, b) => (Number(a.cost) || 0) - (Number(b.cost) || 0)); }
function givenFor(id, r) { const since = lastReset(id); return (state.rewardsGiven || []).some(g => g.m === id && g.r === r.id && (Number(g.at) || 0) > since); }
function reachedFor(id) { const n = starsEarned(id); return milestones().filter(r => (Number(r.cost) || 0) <= n); }
function starCard(m) {
  const t = T[lang], n = starsEarned(m.id), ms = milestones();
  const next = ms.find(r => (Number(r.cost) || 0) > n);
  const prev = ms.filter(r => (Number(r.cost) || 0) <= n).pop();
  const from = prev ? Number(prev.cost) || 0 : 0;
  const count = esc(n === 1 ? t.starsOne : t.starsN).replace("{n}", `<b>${n}</b>`);
  let html = `<div class="star-card"><p class="sc-count"><span class="sc-star" aria-hidden="true">★</span> ${count}</p>`;
  if (!ms.length) html += `<p class="sc-next">${esc(isChild() ? t.msNoneKid : t.msNoneAdult)}</p>`;
  else if (next) {
    const pct = Math.round((n - from) / Math.max(1, (Number(next.cost) || 0) - from) * 100);
    html += `<div class="bar sc-bar" role="img" aria-label="${esc(n + " / " + next.cost)}"><span style="width:${pct}%;background:var(--sun)"></span></div><p class="sc-next">${esc(t.msNext.replace("{left}", (Number(next.cost) || 0) - n + " ★").replace("{r}", next.title))}</p>`;
  } else html += `<p class="sc-next">${esc(t.msAllDone)}</p>`;
  if (ms.length) html += `<ul class="sc-list">${ms.map(r => {
    const got = (Number(r.cost) || 0) <= n, given = got && givenFor(m.id, r);
    return `<li class="${got ? "got" : ""}"><span class="sc-c">${r.cost} ★</span><span class="sc-t">${esc(r.title)}</span>${got ? `<span class="sc-s">${esc(given ? t.msGotIt : t.msWaiting)}</span>` : ""}${got && !given && !isChild() ? `<button type="button" class="ghost" data-give="${r.id}" data-for="${m.id}">${esc(t.msGive)}</button>` : ""}</li>`;
  }).join("")}</ul>`;
  return html + `</div>`;
}
function giveReward(mid, rid) {
  if (isChild()) return;
  const r = (state.rewards || []).find(x => x.id === rid), m = memberById(mid);
  if (!r || !m || givenFor(mid, r)) return;
  state.rewardsGiven = state.rewardsGiven || [];
  const entry = { id: uid(), m: mid, r: rid, title: r.title, cost: r.cost, at: Date.now() };
  state.rewardsGiven.push(entry);
  showUndo(r.title, () => { state.rewardsGiven = state.rewardsGiven.filter(x => x.id !== entry.id); }, T[lang].msGivenToast.replace("{r}", r.title));
  save(); renderAll();
}
function checkMilestone(mid, before) {
  const after = starsEarned(mid);
  if (after <= before) return;
  const hit = milestones().filter(r => (Number(r.cost) || 0) > before && (Number(r.cost) || 0) <= after).pop();
  if (!hit) return;
  const t = T[lang], m = memberById(mid);
  const own = isChild() && hh && hh.memberId === mid;
  showNote((own ? t.msHit : t.msHitOther).replace("{m}", m ? m.name : "").replace("{c}", hit.cost).replace("{r}", hit.title));
  confetti();
}

/* ---------- Start guide ---------- */
let guideStep = 1;
const GUIDE_PICKS = ["Dammsuga", "Diska", "Laga middag", "Tvätta", "Handla mat", "Tömma papperskorgar", "Städa badrummet", "Byta sängkläder", "Planera veckans middagar",
  "Hämta och lämna barn", "Packa väskan till förskolan", "Moppa golv", "Torka av bord och bänkar", "Plocka i och ur diskmaskinen", "Vika och stryka tvätt", "Betala räkningar", "Vattna växter", "Sortera sopor och återvinning"];
function guideOn() { return !!(state && state.guide && isOwner() && !isChild()); }
function guideSteps() { return LOCAL_MODE ? [1, 3, 4] : [1, 2, 3, 4]; }
function renderGuide() {
  const box = document.getElementById("guide");
  box.hidden = !guideOn();
  if (box.hidden) return;
  const t = T[lang], steps = guideSteps();
  if (!steps.includes(guideStep)) guideStep = steps[0];
  const pos = steps.indexOf(guideStep);
  document.getElementById("guide-steps").textContent = t.guideStep.replace("{n}", pos + 1).replace("{total}", steps.length);
  document.getElementById("guide-back").hidden = pos === 0;
  document.getElementById("guide-next").textContent = pos === steps.length - 1 ? t.guideDone : t.guideNext;
  const title = document.getElementById("guide-title"), hint = document.getElementById("guide-hint"), body = document.getElementById("guide-body");
  title.textContent = t["g" + guideStep + "Title"];
  hint.textContent = t["g" + guideStep + "Hint"];
  if (guideStep === 1) {
    const meId = !LOCAL_MODE && hh ? hh.memberId : state.members[0] && state.members[0].id;
    body.innerHTML = `<div>${state.members.map(m => `<div class="g-row"><span class="swatch" style="background:${COLORS[m.color % COLORS.length]}"></span><span class="grow">${esc(m.name)}${m.id === meId ? ` (${esc(t.gYou)})` : ""}</span>${m.id === meId || accountOf(m) ? "" : `<button type="button" class="chip" data-g-kid="${m.id}" aria-pressed="${!!m.kid}">${esc(t.kidLabel)}</button><button type="button" class="ghost" data-g-del="${m.id}" aria-label="${esc(t.remove)}">✕</button>`}</div>`).join("")}</div>
      <form class="g-add" id="g-add-form"><input id="g-name" maxlength="24" placeholder="${esc(t.name)}" aria-label="${esc(t.name)}" required><button class="btn" type="submit"${state.members.length >= 6 ? " disabled" : ""}>${esc(t.add)}</button></form>`;
  } else if (guideStep === 2) {
    const inv = hh && hh.invites;
    body.innerHTML = inv ? [["adult_code", t.gLinkAdult], ["child_code", t.gLinkChild]].map(([k, label]) => k === "child_code" && !settings().parentConsent ? consentRow() : `<div class="g-row"><span class="grow">${esc(label)}</span><button type="button" class="ghost" data-g-copy="${esc(inv[k])}">${esc(t.inviteLinkBtn)}</button>${navigator.share ? `<button type="button" class="ghost" data-g-share="${esc(inv[k])}">${esc(t.inviteShareBtn)}</button>` : ""}</div>`).join("") : "";
  } else if (guideStep === 3) {
    const have = new Set(state.tasks.map(k => k.ref || taskName(k)));
    const picks = GUIDE_PICKS.map(sv => HOUSEHOLD.find(h => h.sv === sv)).filter(Boolean);
    const extra = state.tasks.filter(k => !picks.some(h => h.sv === k.ref));
    body.innerHTML = `<div class="chips">${extra.map(k => `<button type="button" class="chip" data-g-task="${k.id}" aria-pressed="true">${esc(taskName(k))}</button>`).join("")}${picks.map(h => {
      const on = have.has(h.sv);
      return `<button type="button" class="chip" data-g-pick="${esc(h.sv)}" aria-pressed="${on}">${esc(h[lang])}</button>`;
    }).join("")}</div>`;
  } else {
    body.innerHTML = `<p><button type="button" class="btn" id="g-even">${esc(t.gEven)}</button></p><div class="g-assign">${state.tasks.map(k => `<span>${esc(taskName(k))}${k.rot ? ` <span class="pill">${esc(t.gRotate)}</span>` : ""}</span><select data-g-owner="${k.id}" aria-label="${esc(t.owner)}">${state.members.map(m => `<option value="${m.id}"${m.id === k.owner ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select>`).join("")}</div>`;
  }
}
function shareEvenly() {
  const cap = m => isKid(m) ? 0.4 : 1;
  const load = new Map(state.members.map(m => [m.id, 0]));
  const sorted = state.tasks.slice().sort((x, y) => weeklyMins(y) - weeklyMins(x));
  sorted.forEach(k => {
    let best = null, bestScore = Infinity;
    state.members.forEach(m => {
      const heavy = isKid(m) && Number(k.minutes) > 25;
      const score = (load.get(m.id) + weeklyMins(k)) / cap(m) + (heavy ? 1e6 : 0);
      if (score < bestScore) { bestScore = score; best = m; }
    });
    if (best) { k.owner = best.id; k.rot = null; load.set(best.id, load.get(best.id) + weeklyMins(k)); }
  });
}
document.getElementById("guide").addEventListener("click", async e => {
  const t = T[lang];
  const kid = e.target.closest("[data-g-kid]"), del = e.target.closest("[data-g-del]");
  const pick = e.target.closest("[data-g-pick]"), tk = e.target.closest("[data-g-task]");
  const copy = e.target.closest("[data-g-copy]"), share = e.target.closest("[data-g-share]");
  if (kid) { const m = memberById(kid.dataset.gKid); if (m) { m.kid = !m.kid; save(); renderGuide(); } return; }
  if (del) { const id = del.dataset.gDel; state.members = state.members.filter(m => m.id !== id); state.tasks.forEach(k => { if (k.owner === id) k.owner = state.members[0].id; }); save(); renderAll(); return; }
  if (pick) {
    const h = HOUSEHOLD.find(x => x.sv === pick.dataset.gPick);
    const ex = state.tasks.find(k => k.ref === h.sv);
    if (ex) state.tasks = state.tasks.filter(k => k !== ex);
    else state.tasks.push({ id: uid(), title: h[lang], ref: h.sv, cat: h.c, minutes: h.m, freq: freqFor(h), owner: state.members[0].id, done: false });
    save(); renderAll(); return;
  }
  if (tk) { state.tasks = state.tasks.filter(k => k.id !== tk.dataset.gTask); save(); renderAll(); return; }
  if (copy) { if (await copyText(inviteUrl(copy.dataset.gCopy))) { copy.textContent = t.linkCopied; setTimeout(renderGuide, 1500); } return; }
  if (share) { try { await navigator.share({ title: t.title, text: t.inviteShareText, url: inviteUrl(share.dataset.gShare) }); } catch (ex) {} return; }
  if (e.target.id === "g-even") { shareEvenly(); save(); renderAll(); return; }
});
document.getElementById("guide").addEventListener("change", e => {
  const sel = e.target.closest("[data-g-owner]");
  if (!sel) return;
  const k = state.tasks.find(x => x.id === sel.dataset.gOwner);
  if (k && memberById(sel.value)) { k.owner = sel.value; k.rot = null; save(); renderAll(); }
});
document.getElementById("guide").addEventListener("submit", e => {
  if (e.target.id !== "g-add-form") return;
  e.preventDefault();
  const inp = document.getElementById("g-name");
  const name = inp.value.trim();
  if (!name || state.members.length >= 6) return;
  state.members.push({ id: uid(), name, color: nextColor(), kid: false });
  save(); renderAll();
  const again = document.getElementById("g-name"); if (again) again.focus();
});
document.getElementById("guide-next").onclick = () => {
  const steps = guideSteps(), pos = steps.indexOf(guideStep);
  if (pos < steps.length - 1) { guideStep = steps[pos + 1]; renderGuide(); return; }
  state.guide = false; state.welcomeDismissed = true; guideStep = 1; save(); setView("today"); renderAll();
};
document.getElementById("guide-back").onclick = () => {
  const steps = guideSteps(), pos = steps.indexOf(guideStep);
  if (pos > 0) { guideStep = steps[pos - 1]; renderGuide(); }
};
document.getElementById("guide-skip").onclick = () => { state.guide = false; state.welcomeDismissed = true; save(); renderAll(); };

/* ---------- Settings ---------- */
function setMsg(id, text, isErr) {
  const el = document.getElementById(id);
  el.textContent = text || "";
  el.classList.toggle("err", !!isErr);
}
function renderSettings() {
  if (LOCAL_MODE || !hh || !state || !currentUser) return;
  const t = T[lang], st = settings();
  const active = document.activeElement;
  const editing = id => active && active.id === id;
  if (isOwner()) {
    if (!editing("set-hhname")) document.getElementById("set-hhname").value = hh.name || "";
    const ws = document.getElementById("set-weekstart");
    ws.innerHTML = `<option value="1">${t.setMon}</option><option value="0">${t.setSun}</option>`;
    ws.value = String(Number(st.weekStart) === 0 ? 0 : 1);
    const dl = document.getElementById("set-deflang");
    dl.innerHTML = `<option value="">${t.setLangNone}</option><option value="sv">Svenska</option><option value="en">English</option>`;
    dl.value = st.lang || "";
    document.getElementById("set-c-seeall").checked = !!st.childSeeAll;
    document.getElementById("set-c-check").checked = !!st.childCheck;
    document.getElementById("set-c-profile").checked = !!st.childProfile;
  }
  if (!editing("set-name")) {
    const mine = hh.members.find(a => a.user_id === currentUser.id);
    document.getElementById("set-name").value = (mine && mine.display_name) || "";
  }
  if (!editing("set-email")) document.getElementById("set-email").value = currentUser.email || "";
  const list = document.getElementById("set-people-list");
  if (!isChild() && !(list.contains(active) && active.tagName === "INPUT")) {
    list.innerHTML = state.members.map(m => `<div class="hh-row" data-pm="${m.id}">
      <input class="grow" data-pm-name="${m.id}" value="${esc(m.name)}" maxlength="24" aria-label="${esc(t.name)}">
      <div class="swatches">${COLORS.map((c, i) => `<button type="button" data-pm-color="${m.id}" data-c="${i}" aria-pressed="${m.color % COLORS.length === i}" style="background:${c}" aria-label="${i + 1}"></button>`).join("")}</div>
    </div>`).join("");
  }
}
function updateSettings(patch) {
  if (!isOwner() || LOCAL_MODE) return;
  state.settings = { ...settings(), ...patch };
  save(); applyRole(); renderAll();
  setMsg("set-admin-msg", T[lang].setSaved);
}

  e.preventDefault();
  const t = T[lang];
  const a = document.getElementById("set-pw").value, b = document.getElementById("set-pw2").value;

document.getElementById("set-export-btn").onclick = () => {

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hushall-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

/* ---------- Auth ---------- */
let authMode = "login";
function authErrorText(error) {
  const t = T[lang];
  const msg = String((error && error.message) || "");
  if (/invalid login credentials/i.test(msg)) return t.badLogin;
  if (/email not confirmed/i.test(msg)) return t.notConfirmed;
  if (/already registered|already been registered/i.test(msg)) return t.emailTaken;
  if (/my_household|could not find the function/i.test(msg)) return t.dbNotReady;
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(msg)) return t.noConnection;
  return t.otherError + " " + msg;
}
function renderAuth() {
  const t = T[lang];
  const invNote = document.getElementById("invite-note-login");
  invNote.hidden = !getInvite();
  invNote.textContent = t.invitedLogin;
  const reg = authMode === "register";
  document.getElementById("auth-title").textContent = reg ? t.createAccount : t.logIn;
  document.getElementById("reg-only").hidden = !reg;
  document.getElementById("a-name").required = reg;
  document.getElementById("auth-submit").textContent = reg ? t.createAccount : t.logIn;
  document.getElementById("auth-switch").textContent = reg ? t.haveAccount : t.noAccount;
  document.getElementById("a-name").placeholder = t.namePh;
  document.getElementById("a-email").placeholder = t.emailPh;
  document.getElementById("a-pw").placeholder = t.pwPh;
  document.getElementById("a-pw").autocomplete = reg ? "new-password" : "current-password";
  document.querySelectorAll(".pw-toggle").forEach(btn => {
    const input = document.getElementById(btn.dataset.target);
    btn.textContent = input.type === "password" ? t.show : t.hide;
  });
  const hint = document.getElementById("pw-hint");
  hint.textContent = t.pwHint;
  hint.hidden = !reg;
  document.getElementById("pw2-row").hidden = !reg;
  document.getElementById("terms-row").hidden = !reg;
  document.getElementById("a-terms-text").innerHTML = esc(t.termsAccept).replace("{terms}", `<button type="button" class="linkish" data-legal="terms">${esc(t.termsWordT)}</button>`).replace("{privacy}", `<button type="button" class="linkish" data-legal="privacy">${esc(t.termsWordP)}</button>`);
  document.getElementById("a-pw2").required = reg;
  if (!reg) document.getElementById("a-pw2").value = "";
}
document.querySelectorAll(".pw-toggle").forEach(btn => {
  btn.onclick = () => {
    const t = T[lang];
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? t.hide : t.show;
  };
  btn.textContent = T[lang].show;
});
document.getElementById("auth-switch").onclick = () => {
  authMode = authMode === "login" ? "register" : "login";
  document.getElementById("auth-err").textContent = "";
  document.getElementById("auth-info").textContent = "";
  renderAuth();
};

document.getElementById("auth-form").onsubmit = async e => {
  e.preventDefault();
  const t = T[lang];
  const err = document.getElementById("auth-err");
  const info = document.getElementById("auth-info");
  err.textContent = ""; info.textContent = "";
  const btn = document.getElementById("auth-submit");
  const email = document.getElementById("a-email").value.trim().toLowerCase();
  const pw = document.getElementById("a-pw").value;
  btn.disabled = true;
  try {
    if (authMode === "register") {
      const name = document.getElementById("a-name").value.trim();
      const pw2 = document.getElementById("a-pw2").value;
      if (pw.length < 6) { err.textContent = t.weakPw; return; }
      if (pw !== pw2) { err.textContent = t.pwMismatch; return; }
      if (!document.getElementById("a-terms").checked) { err.textContent = t.termsNeeded; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name, terms_at: new Date().toISOString() } } });
      if (error) { err.textContent = authErrorText(error); return; }
      if (!data.session) {
        info.textContent = t.checkEmail;
        authMode = "login"; renderAuth();
        return;
      }
      await onSignedIn(data.user);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) { err.textContent = authErrorText(error); return; }
      await onSignedIn(data.user);
    }
  } catch (ex) {
    err.textContent = authErrorText(ex);
  } finally {
    btn.disabled = false;
  }
};

async function onSignedIn(user) {
  currentUser = user;
  document.getElementById("a-pw").value = "";
  document.getElementById("a-pw2").value = "";
  let opened = true;
  if (LOCAL_MODE) state = await loadHouseholdFor(user);
  else opened = await openHousehold();
  document.getElementById("login").hidden = true;
  if (!opened) { showSetup(); return; }
  finishSignIn();
}
function finishSignIn() {
  lsSet("hb-invite", "");
  document.getElementById("setup").hidden = true;
  document.getElementById("logout").hidden = false;
  autoReset();
  profileId = null;
  applyRole();
  renderAll();
  startPolling();
  mineFetch();
}
function showSetup() {
  stopPolling();
  document.getElementById("login").hidden = true;
  document.getElementById("logout").hidden = true;
  document.getElementById("setup").hidden = false;
  const nm = (currentUser && currentUser.user_metadata && currentUser.user_metadata.name) || "";
  ["s-name1", "s-name2"].forEach(id => { const el = document.getElementById(id); if (!el.value) el.value = nm; });
  document.getElementById("setup-err").textContent = "";
  const inv = getInvite();
  const joinCard = document.getElementById("join-form").closest(".card");
  const note = document.getElementById("invite-note-setup");
  note.hidden = !inv;
  joinCard.classList.toggle("invited", !!inv);
  joinCard.style.order = inv ? "-1" : "";
  if (inv) {
    note.textContent = T[lang].invitedSetup;
    document.getElementById("s-code").value = inv;
    setTimeout(() => { try { joinCard.scrollIntoView({ block: "center" }); } catch (e) {} }, 50);
  }
}
function rpcErrorText(error) {
  const t = T[lang];
  const msg = String((error && error.message) || "");
  if (/invalid_code/.test(msg)) return t.badCode;
  if (/already_in_household|duplicate key/i.test(msg)) return t.alreadyIn;
  if (/not_owner/.test(msg)) return t.errNotOwner;
  if (/target_must_be_adult/.test(msg)) return t.errNeedAdult;
  if (/owner_cannot_leave/.test(msg)) return t.errOwnerLeave;
  if (/my_household|schema cache|could not find the function|does not exist/i.test(msg)) return t.dbNotReady;
  if (/failed to fetch|networkerror|load failed/i.test(msg)) return t.noConnection;
  return t.hhError + " " + msg;
}
async function enterHousehold() {
  const err = document.getElementById("setup-err");
  if (!(await openHousehold())) { err.textContent = T[lang].hhError; return; }
  finishSignIn();
}
document.getElementById("create-form").onsubmit = async e => {

  const err = document.getElementById("setup-err");
  err.textContent = "";
  const name = document.getElementById("s-hhname").value.trim();
  const disp = document.getElementById("s-name1").value.trim();

    if (error) { err.textContent = rpcErrorText(error); return; }
    await enterHousehold();
  } catch (ex) { err.textContent = rpcErrorText(ex); }
  finally { btn.disabled = false; }
};
document.getElementById("join-form").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("setup-err");
  err.textContent = "";
  const code = document.getElementById("s-code").value.trim();
  const disp = document.getElementById("s-name2").value.trim();
  if (!code || !disp) return;

  btn.disabled = true;
  try {
    const { error } = await sb.rpc("join_household", { p_code: code, p_display_name: disp });
    if (error) { err.textContent = rpcErrorText(error); return; }
    await enterHousehold();
  } catch (ex) { err.textContent = rpcErrorText(ex); }
  finally { btn.disabled = false; }
};

async function doLogout() {
  stopPolling();
  if (state && currentUser) { try { await saveNow(); } catch (e) {} }
  if (cacheKey()) { try { localStorage.removeItem(cacheKey()); } catch (e) {} }
  if (!LOCAL_MODE) { try { await mineSync(); } catch (e) {} try { localStorage.removeItem(mineKey()); } catch (e) {} mine = []; }
  if (!LOCAL_MODE) await ntForget();
  await sb.auth.signOut();
  currentUser = null; state = null; hh = null; baseState = null;
  applyRole();
  document.getElementById("logout").hidden = true;
  document.getElementById("setup").hidden = true;
  authMode = "login";
  document.getElementById("login").hidden = false;
  renderAll();
}
document.getElementById("logout").onclick = doLogout;
document.getElementById("setup-logout").onclick = doLogout;

async function initAuth() {
  renderAll();
  try {
    const { data } = await sb.auth.getSession();
    if (data.session && data.session.user) await onSignedIn(data.session.user);
  } catch (ex) {
    document.getElementById("auth-err").textContent = rpcErrorText(ex);
    document.getElementById("login").hidden = false;
  }
}

initAuth();
</script>
</body>
</html>
