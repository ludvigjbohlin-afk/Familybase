/* Anslagstavlan */
#board-list { display: block; }
#board-list li { --mc: var(--primary); border: 0; border-top: .5px solid var(--line); border-radius: 0; padding: 12px 0 12px 18px; background: transparent; color: var(--ink); position: relative; }

/* Inloggning */

/* Sysslelistan: knapparna staplas i egen kolumn så titeln får plats */

/* Flikfältet: genomskinligt som i iOS */

/* ===== Weekly meeting, pocket money ===== */
#meet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
#meet[hidden] { display: none; }
.mt-card { flex: 1 0 auto; max-width: 560px; width: 100%; margin: 0 auto; padding: 20px 0; display: grid; gap: 14px; align-content: start; }

.mt-card .mt-sub { color: var(--muted); margin: 0; }

.mt-card textarea { min-height: 96px; }
.meet-card .card-top h2 { margin: 0; }
.meet-card[hidden], .pocket-set[hidden] { display: none; }
.pocket-set { background: var(--tint-fill); border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; }
.pocket-set .row { align-items: end; }

.pocket-line .kr { font-variant-numeric: tabular-nums; }
/* ===== Invitations to activities ===== */
.inv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.inv-row .lbl { font-size: .8125rem; color: var(--muted); margin-right: 2px; }
.inv-row .chip { min-height: 32px; padding: 4px 12px; font-size: .875rem; }

.inv-st.yes { color: var(--green); }

/* ===== Calendar link, trend, streaks ===== */
.cal-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.streak { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 0; padding: 6px 12px; border-radius: 999px; background: rgba(255,149,0,.16); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.trend { background: var(--tint-fill); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; }
.trend h3 { margin: 0 0 4px; }
.trend .big { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
.trend ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.trend.worse { background: rgba(255,149,0,.14); }
/* ===== Polish, focus mode, tips ===== */

.btn, .ghost, .chip, .oauth-btn, .pulse-btns button, .fx-done, .fx-skip { transition-property: transform, background-color, box-shadow, opacity; transition-duration: .15s; }

@media (prefers-reduced-motion: reduce) { .btn:active, .chip:active, .oauth-btn:active, .pulse-btns button:active, .fx-done:active { transform: none; } }
.focus-open { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin: 4px 0 12px; border-radius: 12px; border: 0; background: var(--tint-fill); color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; }

.start-done .big { font-size: 2.5rem; margin: 0; }

/* ===== Reach: start, invite, accessibility, login ===== */
.login { overflow-y: auto; }
@media (max-height: 760px) { .login { place-items: start center; } }
.login-why { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }

.login-why .ico { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 1rem; }
.login-why b { display: block; font-weight: 600; }
.login-why span.t { color: var(--muted); }
.demo-row { text-align: center; margin: 14px 0 0; }

.start-bar span { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-top h2 { margin: 0; }
.inv-sheet .setup-inner { max-width: 460px; }
.inv-qr { background: #fff; border-radius: 16px; padding: 10px; width: min(260px, 70vw); margin: 6px auto 4px; }

.inv-can { margin: 0 0 12px; padding-left: 1.2em; }

.inv-how { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; counter-reset: s; }
.inv-how li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: .9375rem; }
.inv-how li::before { content: counter(s); flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--tint-fill); color: var(--primary); font-weight: 700; font-size: .8125rem; display: grid; place-items: center; }

.pulse-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

.skip-link { position: absolute; left: 8px; top: -80px; z-index: 50; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 10px; font-weight: 600; }

#main:focus { outline: none; }

@media (prefers-contrast: more) { :root { --muted: var(--ink); } }
</style>
</head>

/* ---------- Cloud sync ---------- */
let saveTimer = null, saving = false, again = false, hh = null, baseState = null, pollTimer = null;
const clone = o => JSON.parse(JSON.stringify(o));
const deepEq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let draft = lsGet("hb-draft") || "";
function isChild() { return !LOCAL_MODE && !!hh && hh.role === "child"; }
function isOwner() { return LOCAL_MODE || (!!hh && hh.role === "owner"); }
function setSyncStatus(key) {
  document.getElementById("sync-status").textContent = key ? T[lang][key] : "";
}
function queueSave() {
  setSyncStatus(navigator.onLine === false ? "syncOffline" : "syncSaving");
  writeCache();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, 600);
}
async function doSave() {
  if (!currentUser || !state) return;
  if (saving) { again = true; return; }
  saving = true;
  try {
    if (LOCAL_MODE) {
      const { error } = await sb.from("household_data").upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() });
      setSyncStatus(error ? "syncError" : "syncSaved");
    } else {
      for (let attempt = 0; attempt < 5 && state; attempt++) {
        if (deepEq(state, baseState)) { setSyncStatus("syncSaved"); break; }
        const payload = clone(state);
        const { data, error } = await sb.rpc("save_household", { p_id: hh.id, p_data: payload, p_expected: hh.version });
        if (error) { setSyncStatus(isNetErr(error) ? "syncOffline" : "syncError"); break; }
        if (data.ok) {
          hh.version = data.version;
          if (data.data) {
            // the server removed something this account may not change: show what was really saved
            const cleaned = normalizeState(data.data);
            state = mergeStates(payload, state, cleaned);
            baseState = clone(cleaned);
            renderAll();
          } else baseState = payload;
          setSyncStatus("syncSaved");
          break;
        }
        // someone else saved first: combine their changes with ours and try again
        const remote = normalizeState(data.data);
        state = mergeStates(baseState, state, remote);
        baseState = clone(remote);
        hh.version = data.version;
        autoReset();
        renderAll();
      }
    }
  } catch (e) {
    setSyncStatus(isNetErr(e) ? "syncOffline" : "syncError");
  } finally {
    saving = false;
    writeCache();
    if (again) { again = false; doSave(); }
  }
}
function save() { queueSave(); }
function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; doSave(); }
}
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  while (saving) await new Promise(r => setTimeout(r, 50));
  await doSave();
}
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

const SETTINGS_DEFAULT = { weekStart: 1, lang: "", childSeeAll: false, childCheck: true, childProfile: true, parentConsent: "", calToken: "" };
function settings() { return { ...SETTINGS_DEFAULT, ...((state && state.settings) || {}) }; }
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
function safeList(a) { return (Array.isArray(a) ? a : []).filter(x => x && typeof x === "object" && SAFE_ID.test(String(x.id))); }
function cleanData(o) {
  // data is shared between family members: ids end up inside HTML attributes, so only plain ids and real numbers get through
  ["members", "tasks", "checkins", "shopping", "swaps", "starLog", "doneLog", "rewards", "redeems", "starResets", "comments", "timeLog", "rewardsGiven", "board", "payouts"].forEach(key => { o[key] = safeList(o[key]); });
  o.members = o.members.map(m => {
    const x = { ...m, color: Math.abs(Math.floor(Number(m.color))) || 0 };
    if (Array.isArray(m.hobbies)) x.hobbies = m.hobbies.filter(h => typeof h === "string" || (h && typeof h === "object" && (!("id" in h) || SAFE_ID.test(String(h.id)))));
    return x;
  });
  o.tasks = o.tasks.map(k => {
    const x = { ...k, minutes: Math.max(0, Math.round(Number(k.minutes) || 0)) };
    if ("steps" in k) x.steps = safeList(k.steps);
    return x;
  });
  o.shopping = o.shopping.map(x => ("qty" in x ? { ...x, qty: Math.max(1, Math.round(Number(x.qty) || 1)) } : x));

  const fair = document.getElementById("fair");
  if (!total) {
    loadEl.innerHTML = ""; note.textContent = t.noLoad; fair.innerHTML = ""; return;
  }
  loadEl.innerHTML = totals.map(({ m, mins }) => {
    const pct = Math.round((mins / total) * 100);
    return `<div class="bar-wrap">
      <div class="bar-head"><span>${esc(m.name)}</span><span>${pct}% (${Math.round(mins)} ${t.minWeek})</span></div>
      <div class="bar"><span style="width:${pct}%;background:${COLORS[m.color % COLORS.length]}"></span></div>
    </div>`;
  }).join("");
  const top = totals.reduce((a, b) => (b.mins > a.mins ? b : a));
  const topPct = Math.round((top.mins / total) * 100);
  const inRange = totals.length < 2 || totals.every(x => {
    const p = (x.mins / total) * 100; return p >= 40 && p <= 60;
  });
  note.textContent = totals.length >= 2 && topPct > 60
    ? t.lean.replace("{name}", top.m.name).replace("{pct}", topPct)
    : t.balanced;
  fair.innerHTML = `<span class="badge-fair" style="background:${inRange ? "rgba(95,143,107,.18)" : "rgba(224,165,38,.2)"};color:var(--ink)">${inRange ? t.fairOk : t.fairOff}</span>`;
  const sg = computeSuggestion();
  if (sg) {
    const text = t.suggest.replace("{task}", esc(taskName(sg.k))).replace("{from}", esc(sg.from.name)).replace("{to}", esc(sg.to.name));
    fair.innerHTML += `<div class="suggest"><span>${text}</span><button class="ghost" data-move-task="${sg.k.id}" data-move-to="${sg.to.id}">${t.move}</button></div>`;
  }
}

function computeSuggestion() {
  if (state.members.length < 2) return null;
  const totals = state.members.map(m => ({ m, mins: state.tasks.filter(k => k.owner === m.id).reduce((a, k) => a + weeklyMins(k), 0) }));
  const total = totals.reduce((a, x) => a + x.mins, 0);
  if (!total) return null;
  const hi = totals.reduce((a, b) => (b.mins > a.mins ? b : a));
  const adultsLeft = totals.filter(x => x.m.id !== hi.m.id && !isKid(x.m));
  const pool = adultsLeft.length ? adultsLeft : totals;
  const lo = pool.reduce((a, b) => (b.mins < a.mins ? b : a));
  if (hi.m.id === lo.m.id || hi.mins / total <= 0.6) return null;
  const diff = hi.mins - lo.mins;
  let best = null;
  state.tasks.filter(k => k.owner === hi.m.id && !(k.done && (k.freq || "weekly") === "once")).forEach(k => {
    const w = weeklyMins(k);
    if (w <= 0 || w >= diff) return;
    const after = Math.abs((hi.mins - w) - (lo.mins + w));
    if (!best || after < best.after) best = { k, after };
  });
  return best ? { k: best.k, from: hi.m, to: lo.m } : null;
}

document.getElementById("hh-body").addEventListener("click", async e => {
  const b = e.target.closest("[data-hh]");
  if (!b || LOCAL_MODE || !hh || isChild()) return;

  if (act === "copy") {
    if (await copyText(b.dataset.code)) { b.textContent = T[lang].copied; setTimeout(renderHousehold, 1500); }
    return;
  }
  if (act === "qr") { openInvite(b.dataset.role, b); return; }

    if (await copyText(inviteUrl(b.dataset.code))) { b.textContent = T[lang].linkCopied; setTimeout(renderHousehold, 1500); }

    hhConfirm = key;

    return;
  }
  hhConfirm = null;

  let res = null;
  try {
    if (act === "role") res = await sb.rpc("set_member_role", { p_id: hh.id, p_user: user, p_role: b.dataset.role });
    else if (act === "remove") res = await sb.rpc("remove_member", { p_id: hh.id, p_user: user });
    else if (act === "owner") res = await sb.rpc("transfer_ownership", { p_id: hh.id, p_user: user });
    else if (act === "codes") res = await sb.rpc("regenerate_invites", { p_id: hh.id });
    else if (act === "leave") { await saveNow(); res = await sb.rpc("leave_household"); }
    else if (act === "delete") res = await sb.rpc("delete_household", { p_id: hh.id });
  } catch (ex) { res = { error: ex }; }
  if (res && res.error) { msg.textContent = rpcErrorText(res.error); renderHousehold(); return; }
  await refreshHousehold(true);
});

function addShopItem(text) {
  text = String(text || "").trim().slice(0, 60);
  let qty = 1, amount = "";
  const mq = text.match(/^(\d+(?:[.,]\d+)?(?:\s*-\s*\d+)?)\s*(st|x|×|pcs|g|gram|kg|hg|ml|cl|dl|l|liter|msk|tsk|krm|paket|pkt|förp|burk|burkar|påse|påsar|flaska|flaskor|knippe|klyfta|klyftor|skivor|tbsp|tsp|cups?|cans?|packs?|bags?|bottles?|cloves?|slices?)?\.?\s+(.+)$/i);
  if (mq) {
    const unit = (mq[2] || "").toLowerCase();
    if (!unit || /^(st|x|×|pcs)$/.test(unit)) qty = Math.max(1, parseInt(mq[1], 10) || 1);
    else amount = (mq[1] + " " + mq[2]).slice(0, 20);
    text = mq[3].trim();
  }
  if (!text) return;
  text = text.charAt(0).toUpperCase() + text.slice(1);
  state.shopping = state.shopping || [];
  const dup = state.shopping.find(x => !x.done && x.text.toLowerCase() === text.toLowerCase());
  if (dup) {
    if (amount) dup.amount = dup.amount ? (dup.amount + " + " + amount).slice(0, 40) : amount;
    else dup.qty = (dup.qty || 1) + (mq ? qty : 1);
  } else {
    const was = state.shopping.find(x => x.done && x.text.toLowerCase() === text.toLowerCase());
    if (was) { was.done = false; was.qty = qty; was.amount = amount; }
    else state.shopping.push(amount ? { id: uid(), text, qty, amount, done: false } : { id: uid(), text, qty, done: false });
  }
  save(); renderShopping();
}

/* ---------- Dates on chores ---------- */
function isoDay(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekStartOf(d) {
  const ws = Number(settings().weekStart) === 0 ? 0 : 1;
  const st = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  st.setDate(st.getDate() - ((st.getDay() - ws + 7) % 7));
  return st;
}
// The date this chore falls on in the current period, or null when it has no fixed day.
function occurrence(k, now) {
  now = now || new Date();
  const f = k.freq || "weekly";
  if (f === "daily") return isoDay(now);
  if (f === "biweekly") {
    // on-week: this week's day; off-week: last on-week if not done yet (late), otherwise the next on-week (later)
    const on = biOn(k, now), st = weekStartOf(now), hasDay = k.wday !== null && k.wday !== undefined && k.wday !== "";
    if (!on) st.setDate(st.getDate() + (k.done ? 7 : -7));
    if (!hasDay) return on ? null : isoDay(st);
    const d = new Date(st); d.setDate(st.getDate() + (Number(k.wday) - st.getDay() + 7) % 7);
    return isoDay(d);
  }
  if (f === "weekly") {
    if (k.wday === null || k.wday === undefined || k.wday === "") return null;
    const st = weekStartOf(now);
    const off = (Number(k.wday) - st.getDay() + 7) % 7;
    const d = new Date(st); d.setDate(st.getDate() + off);
    return isoDay(d);
  }
  if (!k.date) return null;
  if (f === "monthly") {
    const day = Number(k.date.slice(8, 10));
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return isoDay(new Date(now.getFullYear(), now.getMonth(), Math.min(day, last)));
  }
  return k.date;
}
// "open" (no fixed day), "today", "late", "later" (upcoming this period)
function dueStatus(k) {
  const o = occurrence(k);
  if (!o) return "open";
  const today = isoDay(new Date());
  if (o === today) return "today";
  if (o < today) return k.done ? "today" : "late";
  return "later";
}
function whenText(k) {
  const t = T[lang], f = k.freq || "weekly", parts = [];
  if ((f === "weekly" || f === "biweekly") && k.wday !== null && k.wday !== undefined && k.wday !== "") parts.push(t.wdays[Number(k.wday)]);
  if (f === "biweekly" && !biOn(k)) parts.push(t.biNextShort);
  if (f === "once" && k.date) parts.push(fmtDate(k.date));
  if (f === "monthly" && k.date) parts.push(t.monthDay.replace("{d}", Number(k.date.slice(8, 10))));
  if (k.time) parts.push(t.atTime.replace("{t}", k.time));
  return parts.join(", ");
}
// Does chore k fall on day iso (for the calendar)? Daily chores are left out to keep the week readable.
function choreOnDay(k, iso) {
  const f = k.freq || "weekly", d = new Date(iso + "T00:00:00");
  if (f === "daily") return false;
  if (f === "weekly") return k.wday !== null && k.wday !== undefined && k.wday !== "" && Number(k.wday) === d.getDay();
  if (f === "biweekly") return k.wday !== null && k.wday !== undefined && k.wday !== "" && Number(k.wday) === d.getDay() && biOn(k, d);
  if (!k.date) return false;
  if (f === "monthly") { const day = Number(k.date.slice(8, 10)); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return d.getDate() === Math.min(day, last); }
  return k.date === iso;
}

  document.getElementById("cal-range").textContent = days[0].toLocaleDateString(loc, { day: "numeric", month: "short" }) + " – " + days[6].toLocaleDateString(loc, { day: "numeric", month: "short" }) + (calOffset === 0 ? "" : "");

      const { error } = await sb.from("personal_items").upsert(rows);

/* ---------- Stars, rotation, swaps ---------- */
function isKid(m) {

}

function toggleDone(k) {
  k.done = !k.done;

  if (k.done) {
    k.doneAt = Date.now();
    if (isKid(memberById(k.owner)) && starsOf(k) > 0) {
      const before = starsEarned(k.owner);
      state.starLog.push({ id: uid(), m: k.owner, k: k.id, at: k.doneAt, n: starsOf(k) });
      checkMilestone(k.owner, before);
    }
    const cutoff = Date.now() - 120 * 86400000;
    state.doneLog = (state.doneLog || []).filter(e => e.at >= cutoff);
    state.doneLog.push({ id: uid(), m: k.owner, k: k.id, at: k.doneAt, min: Number(k.minutes) || 0 });
  } else {
    const at = k.doneAt;
    state.starLog = state.starLog.filter(e => !(e.k === k.id && e.at === at));
    state.doneLog = (state.doneLog || []).filter(e => !(e.k === k.id && e.at === at));
    k.doneAt = null;
  }
}
function rotNames(k) {
  if (!k.rot || !Array.isArray(k.rot.ids)) return "";
  const ms = k.rot.ids.map(memberById).filter(Boolean);
  return ms.length >= 2 ? ms.map(m => m.name).join(", ") : "";
}
function rotOwner(k) {
  const r = k.rot;
  if (!r || !Array.isArray(r.ids)) return null;
  const ids = r.ids.filter(id => memberById(id));
  if (ids.length < 2) return null;
  const cur = isoDay(weekStartOf(new Date()));
  let n = Math.round((new Date(cur + "T00:00:00") - new Date((r.start || cur) + "T00:00:00")) / 604800000);
  if (k.freq === "biweekly") n = Math.floor(biIndex(k, new Date()) / 2) - Math.floor(biIndex(k, new Date((r.start || cur) + "T00:00:00")) / 2);
  const base = Math.max(0, ids.indexOf(r.first));
  return ids[(((base + n) % ids.length) + ids.length) % ids.length];
}
function applyRotation() {
  if (!state) return false;
  let ch = false;
  const cur = isoDay(weekStartOf(new Date()));
  state.tasks.forEach(k => {
    const o = rotOwner(k);
    if (!o) return;
    const want = k.swap && k.swap.week === cur && memberById(k.swap.to) ? k.swap.to : o;
    if (k.owner !== want) { k.owner = want; ch = true; }
  });
  return ch;
}

/* ---------- Fairness trend: first weeks compared with the latest ---------- */
function fairTrend() {
  const log = state.doneLog || [];

  const adults = state.members.filter(m => !isKid(m));

  log.forEach(e => {
    if (!ids.has(e.m)) return;
    const st = weekStartOf(new Date(e.at)), key = isoDay(st);
    if (!weeks.has(key)) weeks.set(key, { st, mins: new Map(who.map(m => [m.id, 0])) });
    const w = weeks.get(key); w.mins.set(e.m, w.mins.get(e.m) + (Number(e.min) || 0));

  const list = [...weeks.values()].filter(w => [...w.mins.values()].some(v => v > 0)).sort((a, b) => a.st - b.st);

  const sum = arr => { const m = new Map(who.map(x => [x.id, 0])); arr.forEach(w => w.mins.forEach((v, id) => m.set(id, m.get(id) + v))); return m; };
  const score = m => { const tot = [...m.values()].reduce((a, b) => a + b, 0); if (!tot) return null; const e = 100 / m.size, mx = Math.max(...m.values()) / tot * 100; return Math.max(0, Math.round(100 * (1 - (mx - e) / (100 - e)))); };

  } else if (guideStep === 3) {

function shareEvenly() {
  const cap = m => isKid(m) ? 0.4 : 1;
  const load = new Map(state.members.map(m => [m.id, 0]));
  const sorted = state.tasks.slice().sort((x, y) => weeklyMins(y) - weeklyMins(x));
  sorted.forEach(k => {
    let best = null, bestScore = Infinity;
    state.members.forEach(m => {
      const heavy = isKid(m) && Number(k.minutes) > 25;

  });
}

      <input class="grow" data-pm-name="${m.id}" value="${esc(m.name)}" maxlength="24" aria-label="${esc(t.name)}">

    </div>`).join("");
  }
}

  const pick = [["Laga middag", 0], ["Diska", 1], ["Handla mat", 1], ["Tvätta", 0], ["Dammsuga", 1], ["Tömma papperskorgar", 2], ["Lägga undan kläder", 3], ["Plocka i och ur diskmaskinen", 2], ["Byta sängkläder", 0], ["Betala räkningar", 1], ["Vattna växter", 3], ["Städa badrummet", 0]];
  const now = Date.now(), tasks = [], doneLog = [], starLog = [];
  pick.forEach(([ref, o], i) => {

      if (members[o].kid) starLog.push({ id: "sl" + i, m: k.owner, k: k.id, at: k.doneAt, n: 1 });
    }
    tasks.push(k);
  });
  const days = weekDays().map(isoDay);
  const dishes = sv ? [["Köttbullar med potatismos", "Köttbullar, potatis, lingonsylt, mjölk"], ["Laxpasta med spenat", "Laxfilé, pasta, spenat, grädde"], ["Tacos", "Köttfärs, tortillabröd, tomat, gurka, ost"], ["Ärtsoppa och pannkakor", "Ärtsoppa, mjölk, ägg, vetemjöl"], ["Kycklinggryta med ris", "Kyckling, ris, paprika, kokosmjölk"]]

  const meals = {};

  const shopping = (sv ? ["Mjölk", "Bananer", "Toalettpapper", "Pasta", "Ost"] : ["Milk", "Bananas", "Toilet paper", "Pasta", "Cheese"]).map((text, i) => ({ id: "s" + i, text, qty: 1, done: i === 4 }));
  return { members, tasks, leave: {}, checkin: "", guide: false, welcomeDismissed: true, startHidden: true, doneLog, starLog, meals, shopping, board: [] };

/* ---------- Auth ---------- */
let authMode = lsGet("hb-auth-mode") === "register" ? "register" : "login", magicMode = false, oauthOn = { google: false, apple: false };
lsSet("hb-auth-mode", "");
const MAGIC_LINK = false; // turn on when Supabase can send email to everyone (custom SMTP)
function appUrl() { return location.href.split("#")[0].split("?")[0]; }
async function loadAuthProviders() {
  if (LOCAL_MODE) return;
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/settings", { headers: { apikey: SUPABASE_ANON_KEY } });
    if (!r.ok) return;
    const j = await r.json();
    const ext = (j && j.external) || {};
    oauthOn = { google: !!ext.google, apple: !!ext.apple };
    renderAuth();
  } catch (e) {}
}
function authUrlError() {
  try {
    const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
    const msg = q.get("error_description") || h.get("error_description");
    if (!msg) return;
    document.getElementById("auth-err").textContent = authErrorText({ message: msg.replace(/\+/g, " ") });
    history.replaceState(null, "", appUrl());
  } catch (e) {}
}
document.getElementById("oauth-row").addEventListener("click", async e => {
  const b = e.target.closest("[data-oauth]");
  if (!b || LOCAL_MODE) return;
  lsSet("hb-terms-ok", new Date().toISOString());
  b.disabled = true;
  const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.oauth, options: { redirectTo: appUrl() } });
  if (error) { b.disabled = false; document.getElementById("auth-err").textContent = authErrorText(error); }
});
document.getElementById("magic-toggle").onclick = () => {
  magicMode = !magicMode;
  document.getElementById("auth-err").textContent = ""; document.getElementById("auth-info").textContent = "";
  renderAuth();
};
function authErrorText(error) {
  const t = T[lang];
  const msg = String((error && error.message) || "");
  if (/invalid login credentials/i.test(msg)) return t.badLogin;
  if (/email not confirmed/i.test(msg)) return t.notConfirmed;
  if (/already registered|already been registered/i.test(msg)) return t.emailTaken;
  if (/my_household|could not find the function/i.test(msg)) return t.dbNotReady;
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(msg)) return t.noConnection;
  return t.otherError + " " + msg;
}
function renderAuth() {
  const t = T[lang];
  document.getElementById("login-why").innerHTML = t.why.map(([ic, bg, h, p]) => `<li><span class="ico" style="background:${bg}" aria-hidden="true">${ic}</span><span><b>${esc(h)}</b><span class="t">${esc(p)}</span></span></li>`).join("");
  const invNote = document.getElementById("invite-note-login");
  invNote.hidden = !getInvite();
  invNote.textContent = t.invitedLogin;
  const reg = authMode === "register";
  document.getElementById("auth-title").textContent = reg ? t.createAccount : t.logIn;
  document.getElementById("reg-only").hidden = !reg;
  document.getElementById("a-name").required = reg;
  document.getElementById("auth-submit").textContent = reg ? t.createAccount : t.logIn;
  document.getElementById("auth-switch").textContent = reg ? t.haveAccount : t.noAccount;
  document.getElementById("a-name").placeholder = t.namePh;
  document.getElementById("a-email").placeholder = t.emailPh;
  document.getElementById("a-pw").placeholder = t.pwPh;
  document.getElementById("a-pw").autocomplete = reg ? "new-password" : "current-password";
  document.querySelectorAll(".pw-toggle").forEach(btn => {
    const input = document.getElementById(btn.dataset.target);
    btn.textContent = input.type === "password" ? t.show : t.hide;
  });
  const hint = document.getElementById("pw-hint");
  hint.textContent = t.pwHint;
  hint.hidden = !reg;
  document.getElementById("pw2-row").hidden = !reg;
  document.getElementById("terms-row").hidden = !reg;
  document.getElementById("a-terms-text").innerHTML = esc(t.termsAccept).replace("{terms}", `<button type="button" class="linkish" data-legal="terms">${esc(t.termsWordT)}</button>`).replace("{privacy}", `<button type="button" class="linkish" data-legal="privacy">${esc(t.termsWordP)}</button>`);
  const magic = MAGIC_LINK && !LOCAL_MODE && magicMode;
  document.getElementById("a-pw2").required = reg && !magic;
  if (!reg) document.getElementById("a-pw2").value = "";
  const anyOauth = !LOCAL_MODE && (oauthOn.google || oauthOn.apple);
  document.getElementById("oauth-row").hidden = !anyOauth;
  document.querySelectorAll("[data-oauth]").forEach(b => { b.hidden = !oauthOn[b.dataset.oauth]; });
  document.getElementById("oauth-consent").innerHTML = esc(t.oauthConsent).replace("{terms}", `<button type="button" class="linkish" data-legal="terms">${esc(t.termsWordT)}</button>`).replace("{privacy}", `<button type="button" class="linkish" data-legal="privacy">${esc(t.termsWordP)}</button>`);
  document.getElementById("magic-row").hidden = !MAGIC_LINK || LOCAL_MODE;
  document.getElementById("magic-toggle").textContent = magic ? t.magicBack : t.magicUse;
  const pwBlock = document.getElementById("a-pw").closest("div[style]");
  if (pwBlock && !LOCAL_MODE) pwBlock.hidden = magic;
  if (!LOCAL_MODE) document.getElementById("a-pw").required = !magic;
  if (magic) { document.getElementById("pw-hint").hidden = true; document.getElementById("pw2-row").hidden = true; document.getElementById("auth-submit").textContent = t.magicSend; }
  renderDemoBar();
}
document.querySelectorAll(".pw-toggle").forEach(btn => {
  btn.onclick = () => {
    const t = T[lang];
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? t.hide : t.show;
  };
  btn.textContent = T[lang].show;
});
document.getElementById("auth-switch").onclick = () => {
  authMode = authMode === "login" ? "register" : "login";
  document.getElementById("auth-err").textContent = "";
  document.getElementById("auth-info").textContent = "";
  renderAuth();
};

document.getElementById("auth-form").onsubmit = async e => {
  e.preventDefault();
  const t = T[lang];
  const err = document.getElementById("auth-err");
  const info = document.getElementById("auth-info");
  err.textContent = ""; info.textContent = "";
  const btn = document.getElementById("auth-submit");
  const email = document.getElementById("a-email").value.trim().toLowerCase();
  const pw = document.getElementById("a-pw").value;
  btn.disabled = true;
  try {
    if (MAGIC_LINK && magicMode && !LOCAL_MODE) {
      if (authMode === "register" && !document.getElementById("a-terms").checked) { err.textContent = t.termsNeeded; return; }
      const name = document.getElementById("a-name").value.trim();
      const data = { terms_at: new Date().toISOString() };
      if (name) data.name = name;
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: appUrl(), data } });
      if (error) { err.textContent = /not authorized|smtp|sending/i.test(error.message || "") ? t.magicNotReady : authErrorText(error); return; }
      info.textContent = t.magicSent;
      return;
    }
    if (authMode === "register") {
      const name = document.getElementById("a-name").value.trim();
      const pw2 = document.getElementById("a-pw2").value;
      if (pw.length < 6) { err.textContent = t.weakPw; return; }
      if (pw !== pw2) { err.textContent = t.pwMismatch; return; }
      if (!document.getElementById("a-terms").checked) { err.textContent = t.termsNeeded; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name, terms_at: new Date().toISOString() } } });
      if (error) { err.textContent = authErrorText(error); return; }
      if (!data.session) {
        info.textContent = t.checkEmail;
        authMode = "login"; renderAuth();
        return;
      }
      await onSignedIn(data.user);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) { err.textContent = authErrorText(error); return; }
      await onSignedIn(data.user);
    }
  } catch (ex) {
    err.textContent = authErrorText(ex);
  } finally {
    btn.disabled = false;
  }
};

async function onSignedIn(user) {
  currentUser = user;
  if (!lsGet("hb-first")) lsSet("hb-first", String(Date.now()));
  if (!LOCAL_MODE && user && user.user_metadata && !user.user_metadata.terms_at && lsGet("hb-terms-ok")) {
    const md = { terms_at: lsGet("hb-terms-ok") };
    if (!user.user_metadata.name && (user.user_metadata.given_name || user.user_metadata.full_name)) md.name = String(user.user_metadata.given_name || user.user_metadata.full_name).slice(0, 24);
    sb.auth.updateUser({ data: md }).then(() => lsSet("hb-terms-ok", "")).catch(() => {});
  }
  document.getElementById("a-pw").value = "";
  document.getElementById("a-pw2").value = "";
  let opened = true;
  if (LOCAL_MODE) state = await loadHouseholdFor(user);
  else opened = await openHousehold();
  document.getElementById("login").hidden = true;
  if (!opened) { showSetup(); return; }
  finishSignIn();
}
function finishSignIn() {
  lsSet("hb-invite", "");
  document.getElementById("setup").hidden = true;
  document.getElementById("logout").hidden = false;
  autoReset();
  profileId = null;
  applyRole();
  renderAll();
  startPolling();
  mineFetch();
}
function showSetup() {
  stopPolling();
  document.getElementById("login").hidden = true;
  document.getElementById("logout").hidden = true;
  document.getElementById("setup").hidden = false;
  const um = (currentUser && currentUser.user_metadata) || {};
  const nm = String(um.name || um.given_name || um.full_name || "").slice(0, 40);
  ["s-name1", "s-name2"].forEach(id => { const el = document.getElementById(id); if (!el.value) el.value = nm; });
  document.getElementById("setup-err").textContent = "";
  const inv = getInvite();
  const joinCard = document.getElementById("join-form").closest(".card");
  const note = document.getElementById("invite-note-setup");
  note.hidden = !inv;
  joinCard.classList.toggle("invited", !!inv);
  joinCard.style.order = inv ? "-1" : "";
  if (inv) {
    note.textContent = T[lang].invitedSetup;
    document.getElementById("s-code").value = inv;
    setTimeout(() => { try { joinCard.scrollIntoView({ block: "center" }); } catch (e) {} }, 50);
  }
}
function rpcErrorText(error) {
  const t = T[lang];
  const msg = String((error && error.message) || "");
  if (/invalid_code/.test(msg)) return t.badCode;
  if (/already_in_household|duplicate key/i.test(msg)) return t.alreadyIn;
  if (/not_owner/.test(msg)) return t.errNotOwner;
  if (/target_must_be_adult/.test(msg)) return t.errNeedAdult;
  if (/owner_cannot_leave/.test(msg)) return t.errOwnerLeave;
  if (/my_household|schema cache|could not find the function|does not exist/i.test(msg)) return t.dbNotReady;
  if (/failed to fetch|networkerror|load failed/i.test(msg)) return t.noConnection;
  return t.hhError + " " + msg;
}
async function enterHousehold() {
  const err = document.getElementById("setup-err");
  if (!(await openHousehold())) { err.textContent = T[lang].hhError; return; }
  finishSignIn();
}
document.getElementById("create-form").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("setup-err");
  err.textContent = "";
  const name = document.getElementById("s-hhname").value.trim();
  const disp = document.getElementById("s-name1").value.trim();
  if (!disp) return;
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  try {
    const { error } = await sb.rpc("create_household", { p_name: name, p_display_name: disp, p_data: defaultState(disp) });
    if (error) { err.textContent = rpcErrorText(error); return; }
    await enterHousehold();
  } catch (ex) { err.textContent = rpcErrorText(ex); }
  finally { btn.disabled = false; }
};
document.getElementById("join-form").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("setup-err");
  err.textContent = "";
  const code = document.getElementById("s-code").value.trim();
  const disp = document.getElementById("s-name2").value.trim();
  if (!code || !disp) return;
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  try {
    const { error } = await sb.rpc("join_household", { p_code: code, p_display_name: disp });
    if (error) { err.textContent = rpcErrorText(error); return; }
    await enterHousehold();
  } catch (ex) { err.textContent = rpcErrorText(ex); }
  finally { btn.disabled = false; }
};

async function doLogout() {
  if (DEMO) { demoExit(false); return; }
  stopPolling();
  if (state && currentUser) { try { await saveNow(); } catch (e) {} }
  if (cacheKey()) { try { localStorage.removeItem(cacheKey()); } catch (e) {} }
  if (!LOCAL_MODE) { try { await mineSync(); } catch (e) {} try { localStorage.removeItem(mineKey()); } catch (e) {} mine = []; }
  if (!LOCAL_MODE) await ntForget();
  await sb.auth.signOut();
  currentUser = null; state = null; hh = null; baseState = null;
  applyRole();
  document.getElementById("logout").hidden = true;
  document.getElementById("setup").hidden = true;
  authMode = "login";
  document.getElementById("login").hidden = false;
  renderAll();
}
document.getElementById("logout").onclick = doLogout;
document.getElementById("setup-logout").onclick = doLogout;

async function initAuth() {
  authUrlError();
  loadAuthProviders();
  renderAll();
  try {
    const { data } = await sb.auth.getSession();
    if (data.session && data.session.user) await onSignedIn(data.session.user);
  } catch (ex) {
    document.getElementById("auth-err").textContent = rpcErrorText(ex);
    document.getElementById("login").hidden = false;
  }
}

initAuth();
